      function importReviewRow(row, index, result) {
        if (row.skipped) return "";
        const statusClass = result.invalid ? "error" : result.needsReview ? "warning" : "ok";
        const statusText = result.invalid
          ? result.errors[0]
          : result.needsReview
            ? "需要人工核对"
            : result.existing
              ? "有效 · 将更新"
              : "有效 · 将新增";
        return `
          <tr>
            <td data-label="行">${index + 1}</td>
            ${importFieldCell(row, index, "roomNumber", "房间号", result.fieldErrors.roomNumber)}
            ${importFieldCell(row, index, "waterUsage", "用水量", result.fieldErrors.waterUsage)}
            ${importFieldCell(row, index, "electricUsage", "用电量", result.fieldErrors.electricUsage)}
            <td data-label="费用">
              <span class="table-primary">¥${formatMoney(result.waterCharge + result.electricCharge)}</span>
              <small style="display:block;color:var(--slate-500);margin-top:3px">水 ¥${formatMoney(result.waterCharge)} · 电 ¥${formatMoney(result.electricCharge)}</small>
            </td>
            <td data-label="状态与核对">
              <span class="review-status ${statusClass}">${escapeHtml(statusText)}</span>
              <label class="row-check" style="margin-top:8px">
                <input type="checkbox" data-import-confirm="${index}" ${row.confirmed ? "checked" : ""} />
                已人工核对本行
              </label>
            </td>
          </tr>
        `;
      }

      function importFieldCell(row, index, field, label, error) {
        const data = row[field];
        const confidence = Number.isFinite(data.confidence)
          ? `${Math.round(data.confidence * 100)}%`
          : "待人工填写";
        return `
          <td class="ocr-cell" data-label="${label}">
            ${data.image ? `<img class="ocr-thumb" src="${data.image}" alt="第 ${index + 1} 行${label}原图切片" />` : ""}
            <input
              class="ocr-input${error ? " invalid" : ""}"
              data-import-row="${index}"
              data-import-field="${field}"
              value="${escapeHtml(data.value)}"
              inputmode="${field === "roomNumber" ? "numeric" : "decimal"}"
              aria-label="第 ${index + 1} 行${label}"
              ${field === "roomNumber" ? 'maxlength="12"' : ""}
            />
            <span class="ocr-confidence">${error ? escapeHtml(error) : `识别可信度 ${confidence}`}</span>
          </td>
        `;
      }

      function analyzeImportRows() {
        const active = importDraft.rows.filter((row) => !row.skipped);
        const numberCounts = new Map();
        for (const row of active) {
          const number = String(row.roomNumber.value || "").trim();
          if (number) numberCounts.set(number, (numberCounts.get(number) || 0) + 1);
        }
        const rows = importDraft.rows.map((row) => {
          const fieldErrors = {};
          if (row.skipped) {
            return { invalid: false, needsReview: false, errors: [], fieldErrors, existing: false, waterCharge: 0, electricCharge: 0 };
          }
          const number = String(row.roomNumber.value || "").trim();
          const waterText = String(row.waterUsage.value || "").trim();
          const electricText = String(row.electricUsage.value || "").trim();
          const waterUsage = Number(waterText);
          const electricUsage = Number(electricText);
          const room = state.rooms.find((candidate) => String(candidate.number) === number);
          if (!number) fieldErrors.roomNumber = "房间号不能为空";
          else if (!/^\d{1,12}$/.test(number)) fieldErrors.roomNumber = "房间号只能包含数字";
          else if (!room) fieldErrors.roomNumber = "系统中不存在此房间";
          else if (numberCounts.get(number) > 1) fieldErrors.roomNumber = "本表房间号重复";
          if (!/^\d{1,5}(?:\.\d{1,2})?$/.test(waterText) || !Number.isFinite(waterUsage) || waterUsage < 0) {
            fieldErrors.waterUsage = "请输入0至99999.99";
          }
          if (!/^\d{1,5}(?:\.\d{1,2})?$/.test(electricText) || !Number.isFinite(electricUsage) || electricUsage < 0) {
            fieldErrors.electricUsage = "请输入0至99999.99";
          }
          const errors = Object.values(fieldErrors);
          const recognitionUncertain = ["roomNumber", "waterUsage", "electricUsage"].some(
            (key) => row[key].needsReview,
          );
          const needsReview = !errors.length && recognitionUncertain && !row.confirmed;
          const existing = room
            ? state.meterRecords.some(
                (record) => record.roomId === room.id && record.period === importDraft.period,
              )
            : false;
          return {
            invalid: Boolean(errors.length),
            needsReview,
            errors,
            fieldErrors,
            existing,
            room,
            waterUsage: Number.isFinite(waterUsage) ? waterUsage : 0,
            electricUsage: Number.isFinite(electricUsage) ? electricUsage : 0,
            waterCharge: Number.isFinite(waterUsage)
              ? Number((waterUsage * Number(state.settings.waterRate)).toFixed(2))
              : 0,
            electricCharge: Number.isFinite(electricUsage)
              ? Number((electricUsage * Number(state.settings.electricRate)).toFixed(2))
              : 0,
          };
        });
        const considered = rows.filter((_, index) => !importDraft.rows[index].skipped);
        return {
          rows,
          valid: considered.filter((row) => !row.invalid && !row.needsReview).length,
          invalid: considered.filter((row) => row.invalid).length,
          needsReview: considered.filter((row) => row.needsReview).length,
          updates: considered.filter((row) => !row.invalid && row.existing).length,
        };
      }

      function renderImportReviewInPlace() {
        const active = document.activeElement;
        const rowIndex = active?.dataset?.importRow;
        const field = active?.dataset?.importField;
        const position = active?.selectionStart ?? null;
        renderView();
        if (rowIndex !== undefined && field) {
          const input = document.querySelector(
            `[data-import-row="${rowIndex}"][data-import-field="${field}"]`,
          );
          input?.focus();
          if (position !== null) input?.setSelectionRange(position, position);
        }
      }

      function createMeterTemplateCanvas() {
        const canvas = document.createElement("canvas");
        canvas.width = TEMPLATE.width;
        canvas.height = TEMPLATE.height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#071d33";
        for (const [cx, cy] of TEMPLATE.markerCenters) {
          ctx.fillRect(cx - TEMPLATE.marker / 2, cy - TEMPLATE.marker / 2, TEMPLATE.marker, TEMPLATE.marker);
        }
        ctx.textAlign = "center";
        ctx.fillStyle = "#12263a";
        ctx.font = "bold 82px Arial, sans-serif";
        ctx.fillText(`${state.settings.buildingName} · 月度水电手写表`, canvas.width / 2, 210);
        ctx.font = "34px Arial, sans-serif";
        ctx.fillStyle = "#4e6478";
        ctx.fillText(`账期：${formatPeriod(importDraft.period)}　｜　每格填写一个数字，空白小数位按 0 处理`, canvas.width / 2, 284);
        ctx.fillStyle = "#12263a";
        ctx.strokeStyle = "#12263a";
        ctx.lineWidth = 5;
        const tableBottom = TEMPLATE.tableY + TEMPLATE.headerHeight + TEMPLATE.rowHeight * 24;
        ctx.strokeRect(TEMPLATE.tableX, TEMPLATE.tableY, 2120, tableBottom - TEMPLATE.tableY);
        for (const column of TEMPLATE.columns.slice(1)) {
          ctx.beginPath();
          ctx.moveTo(column.x, TEMPLATE.tableY);
          ctx.lineTo(column.x, tableBottom);
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.moveTo(TEMPLATE.tableX, TEMPLATE.tableY + TEMPLATE.headerHeight);
        ctx.lineTo(2300, TEMPLATE.tableY + TEMPLATE.headerHeight);
        ctx.stroke();
        ctx.font = "bold 38px Arial, sans-serif";
        const headings = ["房间号", "用水量（吨）", "用电量（度）"];
        TEMPLATE.columns.forEach((column, index) => {
          ctx.fillText(headings[index], column.x + column.width / 2, TEMPLATE.tableY + 72);
        });
        for (let row = 0; row < 24; row += 1) {
          const y = TEMPLATE.tableY + TEMPLATE.headerHeight + row * TEMPLATE.rowHeight;
          if (row) {
            ctx.strokeStyle = "#708090";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(TEMPLATE.tableX, y);
            ctx.lineTo(2300, y);
            ctx.stroke();
          }
          TEMPLATE.columns.forEach((column) => drawDigitGuides(ctx, column, row));
        }
        ctx.textAlign = "left";
        ctx.fillStyle = "#5f7183";
        ctx.font = "26px Arial, sans-serif";
        ctx.fillText("书写要求：使用深色笔；数字不要连笔或超出格子；拍照时保留四个黑色定位方块。", 180, 3388);
        ctx.textAlign = "right";
        ctx.fillText(`模板 ${TEMPLATE_VERSION}`, 2300, 3388);
        return canvas;
      }

      function digitBoxes(column, row) {
        const isRoom = column.key === "roomNumber";
        const boxWidth = isRoom ? 78 : 68;
        const gap = isRoom ? 20 : 16;
        const decimalExtra = isRoom ? 0 : 30;
        const total = column.digits * boxWidth + (column.digits - 1) * gap + decimalExtra;
        let x = column.x + (column.width - total) / 2;
        const y = TEMPLATE.tableY + TEMPLATE.headerHeight + row * TEMPLATE.rowHeight + 17;
        const boxes = [];
        for (let index = 0; index < column.digits; index += 1) {
          if (!isRoom && index === column.integerDigits) x += decimalExtra;
          boxes.push({ x, y, width: boxWidth, height: 78 });
          x += boxWidth + gap;
        }
        return boxes;
      }

      function drawDigitGuides(ctx, column, row) {
        const boxes = digitBoxes(column, row);
        ctx.save();
        ctx.strokeStyle = "#bdc8d2";
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 7]);
        boxes.forEach((box) => ctx.strokeRect(box.x, box.y, box.width, box.height));
        ctx.restore();
        if (column.key !== "roomNumber") {
          const left = boxes[column.integerDigits - 1];
          const right = boxes[column.integerDigits];
          ctx.fillStyle = "#12263a";
          ctx.beginPath();
          ctx.arc((left.x + left.width + right.x) / 2, left.y + left.height - 7, 7, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function openTemplatePrint() {
        const printWindow = window.open("", "_blank");
        if (!printWindow) {
          showToast("浏览器阻止了打印窗口，请允许弹出窗口后重试");
          return;
        }
        const image = createMeterTemplateCanvas().toDataURL("image/png");
        printWindow.document.write(`<!doctype html><html><head><title>月度水电手写表</title><style>@page{size:A4;margin:0}html,body{margin:0;background:#fff}img{display:block;width:210mm;height:297mm}button{position:fixed;right:16px;top:16px;padding:10px 16px;border:0;border-radius:8px;background:#1769aa;color:white;font-weight:700}@media print{button{display:none}}</style></head><body><button onclick="print()">打印 A4</button><img src="${image}" onload="setTimeout(()=>print(),250)" alt="月度水电手写表"></body></html>`);
        printWindow.document.close();
      }

      function downloadTemplate() {
        const canvas = createMeterTemplateCanvas();
        const anchor = document.createElement("a");
        anchor.href = canvas.toDataURL("image/png");
        anchor.download = `${state.settings.buildingName}-${importDraft.period}-水电手写表.png`.replace(/[\\/:*?"<>|]/g, "-");
        anchor.click();
      }

      async function recognizeMeterSheet(file) {
        if (!file || !/^image\/(jpeg|png|webp)$/.test(file.type)) {
          showToast("请选择 JPG、PNG 或 WebP 图片");
          return;
        }
        importDraft = {
          ...importDraft,
          stage: "processing",
          progress: 2,
          progressText: "正在读取照片",
          rows: [],
          fileName: file.name,
          result: null,
        };
        renderView();
        try {
          const image = await loadImageFile(file);
          updateImportProgress(8, "正在检测四角定位标记");
          const rectified = await rectifyTemplateImage(image);
          updateImportProgress(16, "正在加载本地手写识别模型");
          const session = await ensureOcrSession();
          const rows = [];
          const totalFields = 24 * 3;
          let processed = 0;
          for (let rowIndex = 0; rowIndex < 24; rowIndex += 1) {
            const row = { confirmed: false, skipped: false };
            for (const column of TEMPLATE.columns) {
              const field = await recognizeTemplateField(rectified, column, rowIndex, session);
              row[column.key] = field;
              processed += 1;
              if (processed % 3 === 0) {
                updateImportProgress(
                  16 + (processed / totalFields) * 80,
                  `正在识别第 ${rowIndex + 1} 行，共 24 行`,
                );
                await nextFrame();
              }
            }
            const allBlank = TEMPLATE.columns.every((column) => !row[column.key].value);
            row.skipped = allBlank;
            rows.push(row);
          }
          importDraft.rows = rows;
          importDraft.stage = "review";
          importDraft.progress = 100;
          importDraft.progressText = "识别完成，请逐行核对";
          renderView();
          const firstInput = document.querySelector("[data-import-row]");
          firstInput?.focus();
          showToast("识别完成，请核对后导入");
        } catch (error) {
          console.error("手写表识别失败", error);
          importDraft.stage = "idle";
          importDraft.rows = [];
          renderView();
          showToast(error?.message || "识别失败，请确认照片清晰且四角标记完整");
        }
      }

      function updateImportProgress(progress, text) {
        importDraft.progress = Math.min(100, progress);
        importDraft.progressText = text;
        const heading = document.querySelector(".progress-heading");
        const bar = document.querySelector(".progress-bar");
        if (heading) heading.innerHTML = `<strong>${escapeHtml(text)}</strong><span>${Math.round(progress)}%</span>`;
        if (bar) bar.style.width = `${progress}%`;
      }

      function nextFrame() {
        return new Promise((resolve) => requestAnimationFrame(() => resolve()));
      }

      function loadImageFile(file) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const image = new Image();
          image.onload = () => {
            URL.revokeObjectURL(url);
            resolve(image);
          };
          image.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error("照片读取失败，请重新拍摄或选择其他文件"));
          };
          image.src = url;
        });
      }

      function findCornerMarkers(canvas) {
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        const { width, height } = canvas;
        const data = ctx.getImageData(0, 0, width, height).data;
        const zones = [
          [0.01, 0.3, 0.01, 0.22],
          [0.7, 0.99, 0.01, 0.22],
          [0.7, 0.99, 0.78, 0.99],
          [0.01, 0.3, 0.78, 0.99],
        ];
        return zones.map(([x1, x2, y1, y2]) => {
          const left = Math.round(width * x1);
          const right = Math.round(width * x2);
          const top = Math.round(height * y1);
          const bottom = Math.round(height * y2);
          const zoneWidth = right - left;
          const zoneHeight = bottom - top;
          const visited = new Uint8Array(zoneWidth * zoneHeight);
          let best = null;
          const isDark = (px, py) => {
            const index = (py * width + px) * 4;
            return (
              data[index] * 0.299 +
                data[index + 1] * 0.587 +
                data[index + 2] * 0.114 <
              95
            );
          };
          for (let py = top; py < bottom; py += 1) {
            for (let px = left; px < right; px += 1) {
              const localIndex = (py - top) * zoneWidth + (px - left);
              if (visited[localIndex] || !isDark(px, py)) continue;
              const queueX = [px];
              const queueY = [py];
              visited[localIndex] = 1;
              let cursor = 0;
              let area = 0;
              let minX = px;
              let maxX = px;
              let minY = py;
              let maxY = py;
              while (cursor < queueX.length) {
                const currentX = queueX[cursor];
                const currentY = queueY[cursor];
                cursor += 1;
                area += 1;
                minX = Math.min(minX, currentX);
                maxX = Math.max(maxX, currentX);
                minY = Math.min(minY, currentY);
                maxY = Math.max(maxY, currentY);
                for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
                  const nextX = currentX + dx;
                  const nextY = currentY + dy;
                  if (nextX < left || nextX >= right || nextY < top || nextY >= bottom) continue;
                  const nextIndex = (nextY - top) * zoneWidth + (nextX - left);
                  if (visited[nextIndex]) continue;
                  visited[nextIndex] = 1;
                  if (isDark(nextX, nextY)) {
                    queueX.push(nextX);
                    queueY.push(nextY);
                  }
                }
              }
              const componentWidth = maxX - minX + 1;
              const componentHeight = maxY - minY + 1;
              const fill = area / (componentWidth * componentHeight);
              const square = Math.min(componentWidth, componentHeight) / Math.max(componentWidth, componentHeight);
              const score = area * fill * square;
              if (
                area > 70 &&
                fill > 0.42 &&
                square > 0.55 &&
                (!best || score > best.score)
              ) {
                best = {
                  score,
                  x: (minX + maxX) / 2,
                  y: (minY + maxY) / 2,
                };
              }
            }
          }
          if (!best) throw new Error("未找到完整的四角定位标记，请重新拍摄并保留整张纸");
          return best;
        });
      }

      async function rectifyTemplateImage(image) {
        const source = document.createElement("canvas");
        const maxWidth = 1500;
        const scale = Math.min(1, maxWidth / image.naturalWidth);
        source.width = Math.round(image.naturalWidth * scale);
        source.height = Math.round(image.naturalHeight * scale);
        const sourceCtx = source.getContext("2d", { willReadFrequently: true });
        sourceCtx.drawImage(image, 0, 0, source.width, source.height);
        const markers = findCornerMarkers(source);
        const outputScale = 0.5;
        const output = document.createElement("canvas");
        output.width = Math.round(TEMPLATE.width * outputScale);
        output.height = Math.round(TEMPLATE.height * outputScale);
        const destinations = TEMPLATE.markerCenters.map(([x, y]) => [x * outputScale, y * outputScale]);
        const homography = solveHomography(destinations, markers.map(({ x, y }) => [x, y]));
        const sourcePixels = sourceCtx.getImageData(0, 0, source.width, source.height);
        const outputCtx = output.getContext("2d", { willReadFrequently: true });
        const outputPixels = outputCtx.createImageData(output.width, output.height);
        for (let y = 0; y < output.height; y += 1) {
          for (let x = 0; x < output.width; x += 1) {
            const denominator = homography[6] * x + homography[7] * y + 1;
            const sx = Math.round((homography[0] * x + homography[1] * y + homography[2]) / denominator);
            const sy = Math.round((homography[3] * x + homography[4] * y + homography[5]) / denominator);
            const targetIndex = (y * output.width + x) * 4;
            if (sx >= 0 && sx < source.width && sy >= 0 && sy < source.height) {
              const sourceIndex = (sy * source.width + sx) * 4;
              outputPixels.data[targetIndex] = sourcePixels.data[sourceIndex];
              outputPixels.data[targetIndex + 1] = sourcePixels.data[sourceIndex + 1];
              outputPixels.data[targetIndex + 2] = sourcePixels.data[sourceIndex + 2];
              outputPixels.data[targetIndex + 3] = 255;
            } else {
              outputPixels.data[targetIndex] = 255;
              outputPixels.data[targetIndex + 1] = 255;
              outputPixels.data[targetIndex + 2] = 255;
              outputPixels.data[targetIndex + 3] = 255;
            }
          }
          if (y % 180 === 0) await nextFrame();
        }
        outputCtx.putImageData(outputPixels, 0, 0);
        return output;
      }

      function solveHomography(from, to) {
        const matrix = [];
        const values = [];
        for (let index = 0; index < 4; index += 1) {
          const [x, y] = from[index];
          const [u, v] = to[index];
          matrix.push([x, y, 1, 0, 0, 0, -u * x, -u * y]);
          values.push(u);
          matrix.push([0, 0, 0, x, y, 1, -v * x, -v * y]);
          values.push(v);
        }
        for (let column = 0; column < 8; column += 1) {
          let pivot = column;
          for (let row = column + 1; row < 8; row += 1) {
            if (Math.abs(matrix[row][column]) > Math.abs(matrix[pivot][column])) pivot = row;
          }
          [matrix[column], matrix[pivot]] = [matrix[pivot], matrix[column]];
          [values[column], values[pivot]] = [values[pivot], values[column]];
          const divisor = matrix[column][column];
          if (Math.abs(divisor) < 1e-10) throw new Error("纸张角度过大，无法完成透视校正");
          for (let key = column; key < 8; key += 1) matrix[column][key] /= divisor;
          values[column] /= divisor;
          for (let row = 0; row < 8; row += 1) {
            if (row === column) continue;
            const factor = matrix[row][column];
            for (let key = column; key < 8; key += 1) matrix[row][key] -= factor * matrix[column][key];
            values[row] -= factor * values[column];
          }
        }
        return values;
      }

      async function ensureOcrSession() {
        if (ocrSessionPromise) return ocrSessionPromise;
        ocrSessionPromise = (async () => {
          if (!globalThis.ort) {
            await new Promise((resolve, reject) => {
              const script = document.createElement("script");
              script.src = location.protocol === "file:" ? "./public/ocr/ort.min.js" : "/ocr/ort.min.js";
              script.onload = resolve;
              script.onerror = () => reject(new Error("本地识别程序加载失败，请刷新页面后重试"));
              document.head.appendChild(script);
            });
          }
          const assetBase = location.protocol === "file:" ? "./public/ocr/" : "/ocr/";
          ort.env.wasm.wasmPaths = assetBase;
          ort.env.wasm.numThreads = 1;
          const wasmParts = await Promise.all(
            [
              "ort-wasm.chunk1.bin",
              "ort-wasm.chunk2.bin",
              "ort-wasm.chunk3.bin",
              "ort-wasm.chunk4.bin",
            ].map(async (name) => {
              const response = await fetch(`${assetBase}${name}`);
              if (!response.ok) throw new Error("本地识别运行库不完整，请刷新页面后重试");
              return new Uint8Array(await response.arrayBuffer());
            }),
          );
          const wasmBinary = new Uint8Array(
            wasmParts.reduce((total, part) => total + part.byteLength, 0),
          );
          let wasmOffset = 0;
          for (const part of wasmParts) {
            wasmBinary.set(part, wasmOffset);
            wasmOffset += part.byteLength;
          }
          ort.env.wasm.wasmBinary = wasmBinary;
          const session = await ort.InferenceSession.create(`${assetBase}mnist-12.onnx`, {
            executionProviders: ["wasm"],
            graphOptimizationLevel: "all",
          });
          return session;
        })();
        return ocrSessionPromise;
      }

      async function recognizeTemplateField(canvas, column, rowIndex, session) {
        const scale = canvas.width / TEMPLATE.width;
        const boxes = digitBoxes(column, rowIndex);
        const results = [];
        for (const box of boxes) {
          const digit = await recognizeDigitBox(canvas, box, scale, session);
          results.push(digit);
        }
        const isRoom = column.key === "roomNumber";
        const integer = results
          .slice(0, column.integerDigits)
          .map((result) => result.digit ?? "")
          .join("");
        const fractionResults = results.slice(column.integerDigits);
        const hasFraction = fractionResults.some((result) => result.digit !== null);
        const fraction = fractionResults.map((result) => result.digit ?? "0").join("");
        const hasAny = results.some((result) => result.digit !== null);
        const interiorGap = results.some((result, index) => {
          if (result.digit !== null) return false;
          return results.slice(index + 1).some((candidate) => candidate.digit !== null) &&
            results.slice(0, index).some((candidate) => candidate.digit !== null);
        });
        let value = "";
        if (hasAny) {
          if (isRoom) {
            value = integer;
          } else {
            const integerValue = integer || "0";
            value = hasFraction ? `${integerValue}.${fraction}` : integerValue;
          }
        }
        const usedConfidences = results
          .filter((result) => result.digit !== null)
          .map((result) => result.confidence);
        const confidence = usedConfidences.length ? Math.min(...usedConfidences) : NaN;
        const preview = cropFieldPreview(canvas, column, rowIndex, scale);
        return {
          value,
          confidence,
          image: preview,
          needsReview:
            Boolean(value) &&
            (interiorGap || !Number.isFinite(confidence) || confidence < 0.72),
        };
      }

      async function recognizeDigitBox(canvas, box, scale, session) {
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        const padding = 10;
        const x = Math.round((box.x + padding) * scale);
        const y = Math.round((box.y + padding) * scale);
        const width = Math.max(4, Math.round((box.width - padding * 2) * scale));
        const height = Math.max(4, Math.round((box.height - padding * 2) * scale));
        const pixels = ctx.getImageData(x, y, width, height);
        const gray = new Float32Array(width * height);
        let mean = 0;
        for (let index = 0; index < gray.length; index += 1) {
          const offset = index * 4;
          gray[index] = pixels.data[offset] * 0.299 + pixels.data[offset + 1] * 0.587 + pixels.data[offset + 2] * 0.114;
          mean += gray[index];
        }
        mean /= gray.length;
        const threshold = Math.min(205, mean - 28);
        let minX = width;
        let minY = height;
        let maxX = -1;
        let maxY = -1;
        let ink = 0;
        for (let py = 0; py < height; py += 1) {
          for (let px = 0; px < width; px += 1) {
            if (gray[py * width + px] < threshold) {
              minX = Math.min(minX, px);
              minY = Math.min(minY, py);
              maxX = Math.max(maxX, px);
              maxY = Math.max(maxY, py);
              ink += 1;
            }
          }
        }
        if (ink < width * height * 0.018 || maxX < minX || maxY < minY) {
          return { digit: null, confidence: 1 };
        }
        const digitWidth = maxX - minX + 1;
        const digitHeight = maxY - minY + 1;
        const targetSize = 20;
        const tensorData = new Float32Array(28 * 28);
        const fittedWidth = digitWidth >= digitHeight
          ? targetSize
          : Math.max(4, Math.round((digitWidth / digitHeight) * targetSize));
        const fittedHeight = digitHeight >= digitWidth
          ? targetSize
          : Math.max(4, Math.round((digitHeight / digitWidth) * targetSize));
        const offsetX = Math.round((28 - fittedWidth) / 2);
        const offsetY = Math.round((28 - fittedHeight) / 2);
        for (let ty = 0; ty < fittedHeight; ty += 1) {
          for (let tx = 0; tx < fittedWidth; tx += 1) {
            const sx = Math.min(maxX, minX + Math.floor((tx / fittedWidth) * digitWidth));
            const sy = Math.min(maxY, minY + Math.floor((ty / fittedHeight) * digitHeight));
            tensorData[(offsetY + ty) * 28 + offsetX + tx] = Math.max(
              0,
              Math.min(1, (mean - gray[sy * width + sx]) / Math.max(45, mean)),
            );
          }
        }
        const inputName = session.inputNames[0];
        const outputName = session.outputNames[0];
        const output = await session.run({
          [inputName]: new ort.Tensor("float32", tensorData, [1, 1, 28, 28]),
        });
        const probabilities = softmax(Array.from(output[outputName].data));
        let digit = 0;
        for (let index = 1; index < probabilities.length; index += 1) {
          if (probabilities[index] > probabilities[digit]) digit = index;
        }
        return { digit: String(digit), confidence: probabilities[digit] };
      }

      function softmax(values) {
        const max = Math.max(...values);
        const exponentials = values.map((value) => Math.exp(value - max));
        const total = exponentials.reduce((sum, value) => sum + value, 0);
        return exponentials.map((value) => value / total);
      }

      function cropFieldPreview(canvas, column, rowIndex, scale) {
        const preview = document.createElement("canvas");
        preview.width = 336;
        preview.height = 102;
        const y = (TEMPLATE.tableY + TEMPLATE.headerHeight + rowIndex * TEMPLATE.rowHeight + 6) * scale;
        const sourceX = (column.x + 12) * scale;
        const sourceWidth = (column.width - 24) * scale;
        const sourceHeight = (TEMPLATE.rowHeight - 12) * scale;
        preview.getContext("2d").drawImage(
          canvas,
          sourceX,
          y,
          sourceWidth,
          sourceHeight,
          0,
          0,
          preview.width,
          preview.height,
        );
        return preview.toDataURL("image/jpeg", 0.72);
      }

      async function commitMeterImport() {
        const analysis = analyzeImportRows();
        if (analysis.invalid || analysis.needsReview || !analysis.valid) {
          showToast("请先修正错误并完成人工核对");
          document.querySelector(".ocr-input.invalid")?.focus();
          return;
        }
        if (analysis.updates) {
          const approved = await askConfirm(
            `${formatPeriod(importDraft.period)}已有 ${analysis.updates} 条房间水电记录。继续后将使用本次识别值覆盖这些记录，确认更新吗？`,
            "确认覆盖并导入",
          );
          if (!approved) return;
        }
        const batchId = `IMPORT-${importDraft.period.replace("-", "")}-${String(Date.now()).slice(-6)}`;
        let created = 0;
        let updated = 0;
        for (let index = 0; index < importDraft.rows.length; index += 1) {
          const row = importDraft.rows[index];
          if (row.skipped) continue;
          const result = analysis.rows[index];
          const existing = state.meterRecords.find(
            (record) => record.roomId === result.room.id && record.period === importDraft.period,
          );
          const record = {
            id: existing?.id || makeId("meter"),
            roomId: result.room.id,
            period: importDraft.period,
            inputMode: "monthly-usage",
            waterUsage: Number(result.waterUsage.toFixed(2)),
            electricUsage: Number(result.electricUsage.toFixed(2)),
            waterRate: Number(state.settings.waterRate),
            electricRate: Number(state.settings.electricRate),
            waterCharge: result.waterCharge,
            electricCharge: result.electricCharge,
            importBatchId: batchId,
            templateVersion: TEMPLATE_VERSION,
            updatedAt: new Date().toISOString(),
          };
          if (existing) {
            state.meterRecords = state.meterRecords.map((candidate) =>
              candidate.id === existing.id ? record : candidate,
            );
            updated += 1;
          } else {
            state.meterRecords.push(record);
            created += 1;
          }
        }
        if (saveState(`已导入 ${created + updated} 条月度水电记录`)) {
          importDraft.rows = [];
          importDraft.stage = "done";
          importDraft.result = {
            period: importDraft.period,
            created,
            updated,
            total: created + updated,
          };
          renderView();
        }
      }

              </div>
            </aside>
          </div>
        `;

      function receiptCalculationMarkup(
        rent,
        water,
        electric,
        sanitation,
        tv,
        internet,
        management,
        other,
      ) {
        const additional = [sanitation, tv, internet, management, other].reduce(
          (sum, value) => sum + Math.max(0, Number(value) || 0),
          0,
        );
        const total =
          [rent, water, electric].reduce(
            (sum, value) => sum + Math.max(0, Number(value) || 0),
            0,
          ) + additional;
        return `
          <div class="calc-row"><span>月租</span><strong>¥${formatMoney(rent)}</strong></div>
          <div class="calc-row"><span>水费</span><strong>¥${formatMoney(water)}</strong></div>

          <div class="calc-row total"><span>应收合计</span><strong>¥${formatMoney(total)}</strong></div>
        `;
      }

      function nextReceiptSerial(period) {
        const prefix = `RENT-${period.replace("-", "")}-`;
        const max = state.receipts
          .filter((receipt) => receipt.serial.startsWith(prefix))
          .reduce((highest, receipt) => {
            const sequence = Number(receipt.serial.slice(prefix.length));
            return Math.max(highest, Number.isFinite(sequence) ? sequence : 0);
          }, 0);
        return `${prefix}${String(max + 1).padStart(3, "0")}`;
      }

      function receiptSerialDisplay(serial) {
        const sequence = String(serial || "").split("-").pop().replace(/\D/g, "");
        return String(Number(sequence) || 1).padStart(7, "0");
      }

      function chineseUppercaseInteger(value) {
        const digits = ["零", "壹", "贰", "叁", "肆", "伍", "陆", "柒", "捌", "玖"];
        const smallUnits = ["", "拾", "佰", "仟"];
        const bigUnits = ["", "万", "亿", "兆"];
        const fourDigits = (group) => {
          let output = "";
          let pendingZero = false;
          for (let position = 3; position >= 0; position -= 1) {
            const divisor = 10 ** position;
            const digit = Math.floor(group / divisor) % 10;
            if (digit) {
              if (pendingZero && output) output += "零";
              output += digits[digit] + smallUnits[position];
              pendingZero = false;
            } else if (output) {
              pendingZero = true;
            }
          }
          return output;
        };
        if (!value) return digits[0];
        const groups = [];
        let remaining = Math.floor(value);
        while (remaining > 0) {
          groups.push(remaining % 10000);
          remaining = Math.floor(remaining / 10000);
        }
        let output = "";
        let pendingZero = false;
        for (let index = groups.length - 1; index >= 0; index -= 1) {
          const group = groups[index];
          if (!group) {
            if (output) pendingZero = true;
            continue;
          }
          if (output && (pendingZero || group < 1000)) output += "零";
          output += fourDigits(group) + bigUnits[index];
          pendingZero = false;
        }
        return output;
      }

      function chineseUppercaseMoney(value) {
        const totalFen = Math.round(Math.max(0, Number(value) || 0) * 100);
        const yuan = Math.floor(totalFen / 100);
        const jiao = Math.floor((totalFen % 100) / 10);
        const fen = totalFen % 10;
        const digits = ["零", "壹", "贰", "叁", "肆", "伍", "陆", "柒", "捌", "玖"];
        let result = `${chineseUppercaseInteger(yuan)}圆`;
        if (!jiao && !fen) return `${result}整`;
        if (jiao) result += `${digits[jiao]}角`;
        else if (yuan && fen) result += "零";
        if (fen) result += `${digits[fen]}分`;
        return result;
      }

      function createReceiptImageBlob(receipt) {
        const canvas = document.getElementById("receipt-canvas");
        canvas.width = 1800;
        canvas.height = 1040;
        const ctx = canvas.getContext("2d");
        const font = '"SimSun", "Songti SC", "Microsoft YaHei", serif';
        const ink = "#20202a";
        const purple = "#4d246c";
        const handwriting = "#1767b1";
        const left = 70;
        const right = 1710;
        const tableTop = 230;
        const headerBottom = 330;
        const rowLines = [430, 530, 620, 710, 800, 920];
        const amountStart = 1080;
        const amountEnd = 1430;
        const noteStart = 1430;
        const itemColumns = [70, 270, 480, 690, 900, 1080];
        const amountColumns = Array.from({ length: 8 }, (_, index) => amountStart + index * 50);
        const meter =
          receipt.meterSnapshot ||
          state.meterRecords.find(
            (record) =>
              record.roomId === receipt.roomId && record.period === receipt.period,
          ) ||
          {};
        const sanitation = Number(receipt.sanitationAmount || 0);
        const tv = Number(receipt.tvAmount || 0);
        const internet = Number(receipt.internetAmount || 0);
        const management = Number(receipt.managementAmount || 0);
        const other = Number(receipt.otherAmount || 0);
        const total =
          Number(receipt.total) ||
          [
            receipt.rent,
            receipt.waterCharge,
            receipt.electricCharge,
            sanitation,
            tv,
            internet,
            management,
            other,
          ].reduce((sum, value) => sum + Number(value || 0), 0);

        ctx.fillStyle = "#f5f2f8";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#faf9fc";
        ctx.fillRect(14, 14, 1772, 1012);
        ctx.strokeStyle = purple;
        ctx.lineWidth = 8;
        ctx.strokeRect(14, 14, 1772, 1012);
        ctx.strokeStyle = "#9f84b1";
        ctx.lineWidth = 2;
        ctx.strokeRect(28, 28, 1744, 984);

        ctx.fillStyle = ink;
        ctx.textAlign = "center";
        ctx.font = `700 58px ${font}`;
        ctx.fillText(receipt.receiptTitle || "房租、水、电费（专用）收据", 820, 112);
        ctx.textAlign = "left";
        ctx.font = `34px ${font}`;
        ctx.fillText("№", 1370, 110);
        ctx.fillStyle = "#dc3046";
        ctx.font = `44px "Segoe UI", sans-serif`;
        ctx.fillText(receiptSerialDisplay(receipt.serial), 1418, 112);

        const [year, month, day] = String(receipt.receivedAt || toLocalDateInput(new Date()))
          .split("-")
          .map(Number);
        ctx.fillStyle = ink;
        ctx.font = `30px ${font}`;
        ctx.fillText("用户名称：", 70, 192);
        ctx.fillStyle = handwriting;
        ctx.font = `italic 34px "KaiTi", "STKaiti", ${font}`;
        ctx.fillText(receipt.tenantName || "—", 245, 192);
        ctx.fillText(`${receipt.buildingName || state.settings.buildingName}　${receipt.roomNumber} 房`, 560, 192);
        ctx.fillStyle = ink;
        ctx.font = `28px ${font}`;
        ctx.fillText("年", 1450, 192);
        ctx.fillText("月", 1550, 192);
        ctx.fillText("日", 1645, 192);
        ctx.fillStyle = handwriting;
        ctx.font = `italic 32px "KaiTi", "STKaiti", ${font}`;
        ctx.fillText(String(year), 1364, 192);
        ctx.fillText(String(month), 1510, 192);
        ctx.fillText(String(day), 1605, 192);

        ctx.strokeStyle = ink;
        ctx.lineWidth = 3;
        ctx.strokeRect(left, tableTop, right - left, 690);
        [headerBottom, ...rowLines].forEach((y) => {
          ctx.beginPath();
          ctx.moveTo(left, y);
          ctx.lineTo(right, y);
          ctx.stroke();
        });
        itemColumns.slice(1).forEach((x) => {
          ctx.beginPath();
          ctx.moveTo(x, tableTop);
          ctx.lineTo(x, 530);
          ctx.stroke();
        });
        ctx.beginPath();
        ctx.moveTo(270, 530);
        ctx.lineTo(270, 620);
        ctx.moveTo(amountStart, 530);
        ctx.lineTo(amountStart, 800);
        ctx.moveTo(noteStart, tableTop);
        ctx.lineTo(noteStart, 920);
        ctx.stroke();

        amountColumns.slice(1, -1).forEach((x) => {
          ctx.beginPath();
          ctx.moveTo(x, 280);
          ctx.lineTo(x, 800);
          ctx.stroke();
        });
        ctx.beginPath();
        ctx.moveTo(amountStart, 280);
        ctx.lineTo(amountEnd, 280);
        ctx.stroke();

        const feeColumns = [70, 205, 390, 525, 710, 845, 1080];
        feeColumns.slice(1, -1).forEach((x) => {
          ctx.beginPath();
          ctx.moveTo(x, 620);
          ctx.lineTo(x, 800);
          ctx.stroke();
        });

        const centerText = (text, x1, x2, y1, y2, options = {}) => {
          ctx.save();
          ctx.fillStyle = options.color || ink;
          ctx.font = `${options.weight || 500} ${options.size || 28}px ${options.font || font}`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const value = String(text ?? "—");
          ctx.fillText(value, (x1 + x2) / 2, (y1 + y2) / 2, Math.max(20, x2 - x1 - 12));
          ctx.restore();
        };
        const writeMoneyGrid = (amount, y1, y2) => {
          const numeric = Math.round(Math.max(0, Number(amount) || 0) * 100);
          if (!numeric) return;
          const digits = String(numeric).padStart(7, "0").slice(-7);
          const first = Math.max(0, digits.search(/[1-9]/));
          amountColumns.slice(0, -1).forEach((x, index) => {
            const visible = index >= first ? digits[index] : "";
            centerText(visible, x, amountColumns[index + 1], y1, y2, {
              color: handwriting,
              size: 32,
              font: '"KaiTi", "STKaiti", sans-serif',
            });
          });
        };
        const reading = (value) =>
          value === null || value === undefined || value === ""
            ? "—"
            : Number(value).toFixed(2).replace(/\.00$/, "");

        centerText("项目", 70, 270, tableTop, headerBottom, { weight: 700 });
        centerText("上月", 270, 480, tableTop, headerBottom, { weight: 700 });
        centerText("本月", 480, 690, tableTop, headerBottom, { weight: 700 });
        centerText("实用", 690, 900, tableTop, headerBottom, { weight: 700 });
        centerText("单价", 900, 1080, tableTop, headerBottom, { weight: 700 });
        centerText("金额", amountStart, amountEnd, tableTop, 280, { weight: 700, size: 25 });
        ["万", "千", "百", "十", "元", "角", "分"].forEach((label, index) =>
          centerText(label, amountColumns[index], amountColumns[index + 1], 280, headerBottom, {
            weight: 700,
            size: 24,
          }),
        );
        centerText("备注", noteStart, right, tableTop, headerBottom, { weight: 700 });

        const utilityRows = [
          {
            label: "水费（吨）",
            y1: 330,
            y2: 430,
            previous: meter.prevWater,
            current: meter.currentWater,
            usage: meter.waterUsage,
            rate: meter.waterRate,
            charge: receipt.waterCharge,
          },
          {
            label: "电费（度）",
            y1: 430,
            y2: 530,
            previous: meter.prevElectric,
            current: meter.currentElectric,
            usage: meter.electricUsage,
            rate: meter.electricRate,
            charge: receipt.electricCharge,
          },
        ];
        utilityRows.forEach((row) => {
          centerText(row.label, 70, 270, row.y1, row.y2, { weight: 700 });
          centerText(reading(row.previous), 270, 480, row.y1, row.y2, { color: handwriting, size: 33, font: '"KaiTi", sans-serif' });
          centerText(reading(row.current), 480, 690, row.y1, row.y2, { color: handwriting, size: 33, font: '"KaiTi", sans-serif' });
          centerText(reading(row.usage), 690, 900, row.y1, row.y2, { color: handwriting, size: 33, font: '"KaiTi", sans-serif' });
          centerText(row.rate !== undefined ? `${formatMoney(row.rate)}` : "—", 900, 1080, row.y1, row.y2, { color: handwriting, size: 31, font: '"KaiTi", sans-serif' });
          writeMoneyGrid(row.charge, row.y1, row.y2);
        });

        centerText("房租", 70, 270, 530, 620, { weight: 700 });
        centerText(`¥ ${formatMoney(receipt.rent)}`, 270, 1080, 530, 620, {
          color: handwriting,
          size: 34,
          font: '"KaiTi", sans-serif',
        });
        writeMoneyGrid(receipt.rent, 530, 620);

        const feeRows = [
          [
            ["卫生费", sanitation],
            ["电视费", tv],
            ["网费", internet],
          ],
          [
            ["管理费", management],
            ["其它", other],
            ["支付", receipt.paymentMethod || "—"],
          ],
        ];
        feeRows.forEach((fees, rowIndex) => {
          const y1 = rowIndex ? 710 : 620;
          const y2 = rowIndex ? 800 : 710;
          fees.forEach(([label, value], pairIndex) => {
            centerText(label, feeColumns[pairIndex * 2], feeColumns[pairIndex * 2 + 1], y1, y2, {
              weight: 700,
              size: 25,
            });
            centerText(
              typeof value === "number" ? formatMoney(value) : value,
              feeColumns[pairIndex * 2 + 1],
              feeColumns[pairIndex * 2 + 2],
              y1,
              y2,
              {
                color: handwriting,
                size: 29,
                font: '"KaiTi", sans-serif',
              },
            );
          });
          if (rowIndex === 0) writeMoneyGrid(sanitation + tv + internet, y1, y2);
          else writeMoneyGrid(management + other, y1, y2);
        });

        ctx.save();
        ctx.fillStyle = "#4a374f";
        ctx.font = `24px ${font}`;
        ctx.textAlign = "center";
        const noteLines = [
          "① 存根（白）",
          "② 客户（红）",
          `账期：${formatPeriod(receipt.period)}`,
          `备注：${receipt.note || "无"}`,
        ];
        noteLines.forEach((line, index) =>
          ctx.fillText(line.slice(0, 15), (noteStart + right) / 2, 385 + index * 88),
        );
        ctx.restore();

        ctx.fillStyle = ink;
        ctx.font = `700 28px ${font}`;
        ctx.textAlign = "left";
        ctx.fillText("合　计", 92, 845);
        ctx.font = `24px ${font}`;
        ctx.fillText("人民币（大写）", 92, 885);
        ctx.fillStyle = handwriting;
        ctx.font = `34px "KaiTi", "STKaiti", ${font}`;
        ctx.fillText(chineseUppercaseMoney(total), 340, 875, 920);
        ctx.fillStyle = ink;
        ctx.font = `26px ${font}`;
        ctx.textAlign = "right";
        ctx.fillText(`（¥：${formatMoney(total)}）`, 1690, 875);

        ctx.textAlign = "left";
        ctx.font = `28px ${font}`;
        ctx.fillText("开票人：", 120, 978);
        ctx.fillText("收款人：", 1090, 978);
        ctx.fillStyle = handwriting;
        ctx.font = `italic 32px "KaiTi", "STKaiti", ${font}`;
        ctx.fillText(receipt.issuer || receipt.payee || state.settings.payee, 250, 978);
        ctx.fillText(receipt.payee || state.settings.payee, 1220, 978);

        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error("收据图片生成失败"));
          }, "image/png");
        });
      }

      function safeDownloadName(value) {
        return String(value || "收据").replace(/[\\/:*?"<>|]/g, "-");
      }

      function triggerBlobDownload(blob, fileName) {
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = safeDownloadName(fileName);
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1500);
      }

      async function downloadReceiptImage(receipt) {
        try {
          const blob = await createReceiptImageBlob(receipt);
          triggerBlobDownload(blob, `${receipt.serial}-${receipt.roomNumber}.png`);
        } catch (error) {
          console.error(error);
          showToast("收据图片生成失败");
        }
      }

      function zipCrc32(bytes) {
        let crc = 0xffffffff;
        for (const byte of bytes) {
          crc ^= byte;
          for (let bit = 0; bit < 8; bit += 1) {
            crc = (crc >>> 1) ^ (crc & 1 ? 0xedb88320 : 0);
          }
        }
        return (crc ^ 0xffffffff) >>> 0;
      }

      function zipDosDateTime(date = new Date()) {
        const year = Math.max(1980, date.getFullYear());
        return {
          date: ((year - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate(),
          time: (date.getHours() << 11) | (date.getMinutes() << 5) | (date.getSeconds() >> 1),
        };
      }

      function buildStoredZip(entries) {
        const encoder = new TextEncoder();
        const localParts = [];
        const centralParts = [];
        const { date, time } = zipDosDateTime();
        let localOffset = 0;

        entries.forEach((entry) => {
          const nameBytes = encoder.encode(entry.name);
          const bytes = entry.bytes;
          const crc = zipCrc32(bytes);
          const local = new Uint8Array(30 + nameBytes.length);
          const localView = new DataView(local.buffer);
          localView.setUint32(0, 0x04034b50, true);
          localView.setUint16(4, 20, true);
          localView.setUint16(6, 0x0800, true);
          localView.setUint16(8, 0, true);
          localView.setUint16(10, time, true);
          localView.setUint16(12, date, true);
          localView.setUint32(14, crc, true);
          localView.setUint32(18, bytes.length, true);
          localView.setUint32(22, bytes.length, true);
          localView.setUint16(26, nameBytes.length, true);
          local.set(nameBytes, 30);
          localParts.push(local, bytes);

          const central = new Uint8Array(46 + nameBytes.length);
          const centralView = new DataView(central.buffer);
          centralView.setUint32(0, 0x02014b50, true);
          centralView.setUint16(4, 20, true);
          centralView.setUint16(6, 20, true);
          centralView.setUint16(8, 0x0800, true);
          centralView.setUint16(10, 0, true);
          centralView.setUint16(12, time, true);
          centralView.setUint16(14, date, true);
          centralView.setUint32(16, crc, true);
          centralView.setUint32(20, bytes.length, true);
          centralView.setUint32(24, bytes.length, true);
          centralView.setUint16(28, nameBytes.length, true);
          centralView.setUint32(42, localOffset, true);
          central.set(nameBytes, 46);
          centralParts.push(central);
          localOffset += local.length + bytes.length;
        });

        const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
        const end = new Uint8Array(22);
        const endView = new DataView(end.buffer);
        endView.setUint32(0, 0x06054b50, true);
        endView.setUint16(8, entries.length, true);
        endView.setUint16(10, entries.length, true);
        endView.setUint32(12, centralSize, true);
        endView.setUint32(16, localOffset, true);
        return new Blob([...localParts, ...centralParts, end], { type: "application/zip" });
      }

      async function downloadSelectedReceipts() {
        const receipts = state.receipts
          .filter((receipt) => selectedReceiptIds.has(receipt.id))
          .sort((a, b) => a.period.localeCompare(b.period) || a.roomNumber.localeCompare(b.roomNumber));
        if (!receipts.length) {
          showToast("请先选择需要下载的收据");
          return;
        }
        showToast(`正在生成 ${receipts.length} 张收据，请稍候`);
        try {
          const entries = [];
          for (const receipt of receipts) {
            const blob = await createReceiptImageBlob(receipt);
            entries.push({
              name: safeDownloadName(`${receipt.serial}-${receipt.roomNumber}.png`),
              bytes: new Uint8Array(await blob.arrayBuffer()),
            });
          }
          const periodName = receiptPeriodFilter || "全部账期";
          triggerBlobDownload(
            buildStoredZip(entries),
            `${state.settings.buildingName}-${periodName}-收据-${receipts.length}张.zip`,
          );
          showToast(`已打包下载 ${receipts.length} 张收据`);
        } catch (error) {
          console.error(error);
          showToast("批量下载失败，请重试");
        }
      }

      document.addEventListener("submit", (event) => {
        event.preventDefault();
        const form = event.target;

        if (form.id === "room-form") {
          const data = new FormData(form);
          const roomId = data.get("roomId");
          const number = String(data.get("number") || "").trim();
          const floor = Number(data.get("floor"));
          const status = data.get("status");
          const tenantName = String(data.get("tenantName") || "").trim();
          const monthlyRent = Number(data.get("monthlyRent"));
          const error = document.getElementById("room-form-error");
          if (!number || !Number.isInteger(floor) || floor < 1 || monthlyRent < 0) {
            error.textContent = "请填写有效的房号、楼层和月租。";
            return;
          }
          if (state.rooms.some((room) => room.number === number && room.id !== roomId)) {
            error.textContent = "房间号已存在，请更换后再保存。";
            return;
          }
          if (status === "occupied" && !tenantName) {
            error.textContent = "在租房间必须填写租客姓名。";
            return;
          }
          const room = {
            id: roomId || makeId("room"),
            number,
            floor,
            status,
            tenantName: status === "occupied" ? tenantName : "",
            phone: status === "occupied" ? String(data.get("phone") || "").trim() : "",
            monthlyRent,
            moveInDate: status === "occupied" ? String(data.get("moveInDate") || "") : "",
            note: String(data.get("note") || "").trim(),
          };
          if (roomId) {
            state.rooms = state.rooms.map((candidate) =>
              candidate.id === roomId ? room : candidate,
            );
          } else {
            state.rooms.push(room);
          }
          closeDialog(roomDialog);
          saveState(roomId ? "房间档案已更新" : "房间已新增");
          renderView();
        }

        if (form.id === "meter-form") {
          const data = new FormData(form);
          const roomId = String(data.get("roomId"));
          const period = String(data.get("period"));
          const prevWater = Number(data.get("prevWater"));
          const currentWater = Number(data.get("currentWater"));
          const prevElectric = Number(data.get("prevElectric"));
          const currentElectric = Number(data.get("currentElectric"));
          const error = document.getElementById("meter-form-error");
          if (
            !roomId ||
            !period ||
            [prevWater, currentWater, prevElectric, currentElectric].some(
              (value) => !Number.isFinite(value) || value < 0,
            )
          ) {
            error.textContent = "请填写完整且不小于0的水电读数。";
            return;
          }
          if (currentWater < prevWater || currentElectric < prevElectric) {
            error.textContent = "本期读数不能低于上期读数。";
            return;
          }
          const existing = state.meterRecords.find(
            (record) => record.roomId === roomId && record.period === period,
          );
          const waterUsage = currentWater - prevWater;
          const electricUsage = currentElectric - prevElectric;
          const record = {
            id: existing?.id || makeId("meter"),
            roomId,
            period,
            inputMode: "meter-reading",
            prevWater,
            currentWater,
            prevElectric,
            currentElectric,
            waterRate: Number(state.settings.waterRate),
            electricRate: Number(state.settings.electricRate),
            waterUsage,
            electricUsage,
            waterCharge: Number((waterUsage * Number(state.settings.waterRate)).toFixed(2)),
            electricCharge: Number((electricUsage * Number(state.settings.electricRate)).toFixed(2)),
            updatedAt: new Date().toISOString(),
          };
          state.meterRecords = existing
            ? state.meterRecords.map((candidate) =>
                candidate.id === existing.id ? record : candidate,
              )
            : [...state.meterRecords, record];
          saveState(existing ? "本期抄表记录已更新" : "本期抄表记录已保存");
          renderView();
        }

        if (form.id === "meter-usage-form") {
          const data = new FormData(form);
          const recordId = String(data.get("recordId"));
          const waterUsage = Number(data.get("waterUsage"));
          const electricUsage = Number(data.get("electricUsage"));
          const error = document.getElementById("meter-usage-form-error");
          if (
            !Number.isFinite(waterUsage) ||
            !Number.isFinite(electricUsage) ||
            waterUsage < 0 ||
            electricUsage < 0 ||
            waterUsage > 99999.99 ||
            electricUsage > 99999.99
          ) {
            error.textContent = "请输入0至99999.99之间的有效用量。";
            return;
          }
          const record = state.meterRecords.find((candidate) => candidate.id === recordId);
          if (!record) {
            error.textContent = "记录不存在，请返回抄表记录后重试。";
            return;
          }
          record.waterUsage = Number(waterUsage.toFixed(2));
          record.electricUsage = Number(electricUsage.toFixed(2));
          record.waterRate = Number(state.settings.waterRate);
          record.electricRate = Number(state.settings.electricRate);
          record.waterCharge = Number((record.waterUsage * record.waterRate).toFixed(2));
          record.electricCharge = Number((record.electricUsage * record.electricRate).toFixed(2));
          record.updatedAt = new Date().toISOString();
          saveState("批量导入记录已修正");
          renderView();
        }

        if (form.id === "meter-settings-form") {
          const data = new FormData(form);
          const waterRate = Number(data.get("waterRate"));
          const electricRate = Number(data.get("electricRate"));
          if (waterRate < 0 || electricRate < 0) {
            showToast("水电单价不能小于0");
            return;

          state.settings.waterRate = waterRate;
          state.settings.electricRate = electricRate;
          saveState("水电单价已保存");
          renderView();
        }

        if (form.id === "receipt-form") {
          const data = new FormData(form);
          const roomId = String(data.get("roomId"));
          const period = String(data.get("period"));
          const error = document.getElementById("receipt-form-error");
          if (state.receipts.some((receipt) => receipt.roomId === roomId && receipt.period === period)) {
            error.textContent = "该房间本账期已开具收据，请从收据记录中重新下载。";
            return;
          }
          const amounts = {
            rent: Number(data.get("rent")),
            waterCharge: Number(data.get("waterCharge")),
            electricCharge: Number(data.get("electricCharge")),
            sanitationAmount: Number(data.get("sanitationAmount")),
            tvAmount: Number(data.get("tvAmount")),
            internetAmount: Number(data.get("internetAmount")),
            managementAmount: Number(data.get("managementAmount")),
            otherAmount: Number(data.get("otherAmount")),
          };
          if (
            !roomId ||
            !period ||
            !String(data.get("tenantName") || "").trim() ||
            !String(data.get("issuer") || "").trim() ||
            !String(data.get("payee") || "").trim() ||
            Object.values(amounts).some((value) => !Number.isFinite(value) || value < 0)
          ) {
            error.textContent = "请完整填写房间、租客、账期和有效费用金额。";
            return;
          }
          const room = state.rooms.find((candidate) => candidate.id === roomId);
          const receipt = {
            id: makeId("receipt"),
            serial: nextReceiptSerial(period),
            roomId,
            roomNumber: room.number,
            tenantName: String(data.get("tenantName")).trim(),
            period,
            ...amounts,
            total: Number(Object.values(amounts).reduce((sum, value) => sum + value, 0).toFixed(2)),
            paymentMethod: String(data.get("paymentMethod")),
            receivedAt: String(data.get("receivedAt")),
            issuer: String(data.get("issuer")).trim(),
            payee: String(data.get("payee")).trim(),
            note: String(data.get("note") || "").trim(),
            buildingName: state.settings.buildingName,
            receiptTitle: state.settings.receiptTitle,
            meterSnapshot: meter
              ? {
                  inputMode: meter.inputMode,
                  prevWater: meter.prevWater ?? null,
                  currentWater: meter.currentWater ?? null,
                  waterUsage: meter.waterUsage,
                  waterRate: meter.waterRate,
                  prevElectric: meter.prevElectric ?? null,
                  currentElectric: meter.currentElectric ?? null,
                  electricUsage: meter.electricUsage,
                  electricRate: meter.electricRate,
                }
              : null,
            createdAt: new Date().toISOString(),
          };
          state.receipts.push(receipt);

            navigate("receipt-records");

          state.settings.payee = String(data.get("payee")).trim();
          saveState("收据模板已保存");
          renderView();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeDrawer();
        if (event.key === "Tab" && sidebar.classList.contains("open")) {
          const focusable = [...sidebar.querySelectorAll("button:not([disabled])")];
          if (!focusable.length) return;
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        }
      });

      window.addEventListener("resize", () => {
        if (window.innerWidth > 920) closeDrawer(false);
      });

      roomDialog.addEventListener("close", () => {
        document.getElementById("room-form-error").textContent = "";
      });
      confirmDialog.addEventListener("cancel", (event) => {
        event.preventDefault();
        resolveConfirm(false);
      });

      renderChrome();
      renderView();
    </script>
  </body>
</html>
