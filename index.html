<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="面向单栋出租楼的房间、水电和租金收据管理工具。"
    />
    <meta name="theme-color" content="#173b67" />
    <title>房务通 · 单栋出租楼管理</title>
    <style>
      :root {
        --navy-950: #0d294b;
        --navy-900: #14385f;
        --navy-800: #194a78;
        --blue-700: #2368aa;
        --blue-600: #347fc0;
        --blue-100: #e8f2fb;
        --blue-50: #f3f8fd;
        --slate-950: #182235;
        --slate-800: #344054;
        --slate-700: #475467;
        --slate-600: #667085;
        --slate-500: #7c889a;
        --slate-300: #cbd3df;
        --slate-200: #e1e7ef;
        --slate-100: #edf1f6;
        --slate-50: #f6f8fb;
        --white: #fff;
        --green: #247c5d;
        --green-bg: #e9f7f1;
        --amber: #a86b1f;
        --amber-bg: #fff3df;
        --red: #b54752;
        --red-bg: #fff0f1;
        --sidebar: 278px;
        --shadow-sm: 0 1px 2px rgba(20, 56, 95, 0.04),
          0 5px 16px rgba(20, 56, 95, 0.05);
        --shadow-md: 0 18px 44px rgba(13, 41, 75, 0.13);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background:
          radial-gradient(circle at 88% 0, rgba(52, 127, 192, 0.08), transparent 32rem),
          var(--slate-50);
        color: var(--slate-950);
        font-family:
          "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC",
          "Segoe UI", sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      body.drawer-open {
        overflow: hidden;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
      }

      button,
      a,
      select {
        -webkit-tap-highlight-color: transparent;
      }

      :focus-visible {
        outline: 3px solid rgba(52, 127, 192, 0.3);
        outline-offset: 2px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      .skip-link {
        position: fixed;
        left: 18px;
        top: 14px;
        z-index: 1200;
        padding: 10px 14px;
        border-radius: 10px;
        background: white;
        color: var(--navy-900);
        box-shadow: var(--shadow-md);
        transform: translateY(-160%);
        transition: transform 0.2s ease;
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 900;
        display: flex;
        width: var(--sidebar);
        flex-direction: column;
        overflow: hidden;
        background:
          radial-gradient(circle at 10% 3%, rgba(105, 178, 231, 0.2), transparent 14rem),
          linear-gradient(165deg, var(--navy-900), var(--navy-950) 76%);
        color: rgba(255, 255, 255, 0.78);
        box-shadow: 8px 0 32px rgba(13, 41, 75, 0.08);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 13px;
        min-height: 94px;
        padding: 23px 23px 19px;
      }

      .brand-mark {
        display: grid;
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.26);
        border-radius: 14px;
        background: linear-gradient(145deg, #4b97d5, #2466a3);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.3),
          0 10px 24px rgba(1, 19, 40, 0.2);
        color: white;
        font-size: 25px;
        line-height: 1;
      }

      .brand-name {
        display: block;
        color: white;
        font-size: 19px;
        font-weight: 780;
        letter-spacing: 0.04em;
      }

      .brand-subtitle {
        display: block;
        margin-top: 2px;
        color: rgba(255, 255, 255, 0.45);
        font-size: 11px;
        letter-spacing: 0.1em;
      }

      .sidebar-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 8px 15px 24px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.17) transparent;
      }

      .nav-label {
        margin: 4px 11px 11px;
        color: rgba(255, 255, 255, 0.34);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      .nav-group + .nav-group {
        margin-top: 7px;
      }

      .nav-parent {
        display: grid;
        width: 100%;
        min-height: 53px;
        grid-template-columns: 35px 1fr 20px;
        align-items: center;
        gap: 11px;
        padding: 8px 12px;
        border-radius: 13px;
        background: transparent;
        color: rgba(255, 255, 255, 0.72);
        cursor: pointer;
        text-align: left;
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }

      .nav-parent:hover,
      .nav-parent.active {
        background: rgba(255, 255, 255, 0.08);
        color: white;
      }

      .nav-parent-icon {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        font-size: 14px;
        font-weight: 800;
      }

      .nav-parent.active .nav-parent-icon {
        border-color: rgba(105, 181, 237, 0.36);
        background: rgba(72, 148, 207, 0.22);
      }

      .nav-parent-title {
        font-size: 14px;
        font-weight: 680;
      }

      .nav-chevron {
        color: rgba(255, 255, 255, 0.35);
        font-size: 16px;
        transform: rotate(-90deg);
        transition: transform 0.2s ease;
      }

      .nav-parent[aria-expanded="true"] .nav-chevron {
        transform: rotate(0);
      }

      .nav-children {
        display: grid;
        max-height: 0;
        gap: 3px;
        overflow: hidden;
        padding: 0 4px 0 48px;
        opacity: 0;
        transition:
          max-height 0.25s ease,
          opacity 0.2s ease,
          padding 0.25s ease;
      }

      .nav-children.open {
        max-height: 230px;
        padding-top: 6px;
        padding-bottom: 5px;
        opacity: 1;
      }

      .nav-child {
        position: relative;
        width: 100%;
        padding: 8px 10px;
        border-radius: 9px;
        background: transparent;
        color: rgba(255, 255, 255, 0.47);
        cursor: pointer;
        text-align: left;
        font-size: 12px;
        transition:
          color 0.18s ease,
          background 0.18s ease;
      }

      .nav-child::before {
        position: absolute;
        left: -15px;
        top: 50%;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        content: "";
        transform: translateY(-50%);
      }

      .nav-child:hover {
        color: rgba(255, 255, 255, 0.85);
      }

      .nav-child.active {
        background: rgba(83, 159, 218, 0.16);
        color: #b8dcf7;
        font-weight: 680;
      }

      .sidebar-status {
        margin: 0 16px 18px;
        padding: 14px 15px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.05);
      }

      .sidebar-status span {
        display: flex;
        align-items: center;
        gap: 8px;
        color: rgba(255, 255, 255, 0.52);
        font-size: 11px;
      }

      .sidebar-status span::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #62d5ab;
        box-shadow: 0 0 0 4px rgba(98, 213, 171, 0.1);
        content: "";
      }

      .sidebar-status strong {
        display: block;
        margin-top: 7px;
        color: white;
        font-size: 15px;
      }

      .mobile-topbar,
      .drawer-overlay {
        display: none;
      }

      .main {
        min-height: 100vh;
        margin-left: var(--sidebar);
        padding: 27px clamp(24px, 3.2vw, 52px) 52px;
      }

      .main-inner {
        width: min(100%, 1440px);
        margin: 0 auto;
      }

      .top-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
      }

      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 6px;
        color: var(--slate-500);
        font-size: 12px;
      }

      .breadcrumb-separator {
        color: var(--slate-300);
      }

      .page-title {
        margin: 0;
        color: var(--slate-950);
        font-size: clamp(25px, 3vw, 33px);
        font-weight: 780;
        letter-spacing: -0.025em;
        line-height: 1.22;
      }

      .page-description {
        margin: 7px 0 0;
        color: var(--slate-500);
        font-size: 13px;
      }

      .date-chip {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 9px;
        padding: 10px 13px;
        border: 1px solid var(--slate-200);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.82);
        color: var(--slate-600);
        box-shadow: var(--shadow-sm);
        font-size: 12px;
      }

      .date-chip b {
        color: var(--blue-700);
        font-size: 15px;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 13px;
        margin-bottom: 20px;
      }

      .stat-card {
        position: relative;
        overflow: hidden;
        padding: 18px 19px;
        border: 1px solid rgba(203, 211, 223, 0.74);
        border-radius: 17px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: var(--shadow-sm);
      }

      .stat-card::after {
        position: absolute;
        right: -15px;
        bottom: -22px;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: var(--stat-color, var(--blue-100));
        content: "";
        opacity: 0.65;
      }

      .stat-label {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--slate-500);
        font-size: 12px;
      }

      .stat-label::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--stat-dot, var(--blue-600));
        content: "";
      }

      .stat-value {
        display: block;
        margin-top: 7px;
        color: var(--slate-950);
        font-size: 25px;
        font-weight: 800;
        line-height: 1.1;
      }

      .stat-suffix {
        margin-left: 3px;
        color: var(--slate-500);
        font-size: 11px;
        font-weight: 500;
      }

      .panel {
        border: 1px solid rgba(203, 211, 223, 0.76);
        border-radius: 21px;
        background: rgba(255, 255, 255, 0.93);
        box-shadow: var(--shadow-sm);
      }

      .panel + .panel {
        margin-top: 15px;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 20px 22px;
        border-bottom: 1px solid var(--slate-100);
      }

      .panel-title {
        margin: 0;
        color: var(--slate-800);
        font-size: 17px;
        font-weight: 760;
      }

      .panel-subtitle {
        margin: 4px 0 0;
        color: var(--slate-500);
        font-size: 12px;
      }

      .panel-body {
        padding: 22px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .toolbar-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 9px;
      }

      .button {
        display: inline-flex;
        min-height: 39px;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 8px 14px;
        border: 1px solid transparent;
        border-radius: 11px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 680;
        transition:
          transform 0.17s ease,
          box-shadow 0.17s ease,
          border-color 0.17s ease,
          background 0.17s ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button:active {
        transform: translateY(0);
      }

      .button-primary {
        background: linear-gradient(135deg, var(--blue-700), var(--navy-800));
        color: white;
        box-shadow: 0 7px 16px rgba(35, 104, 170, 0.18);
      }

      .button-secondary {
        border-color: var(--slate-200);
        background: white;
        color: var(--slate-700);
      }

      .button-soft {
        background: var(--blue-50);
        color: var(--blue-700);
      }

      .button-danger {
        border-color: #f1ccd0;
        background: var(--red-bg);
        color: var(--red);
      }

      .button-small {
        min-height: 32px;
        padding: 6px 10px;
        border-radius: 9px;
        font-size: 11px;
      }

      .filter-input,
      .field-input,
      .field-select,
      .field-textarea {
        width: 100%;
        border: 1px solid var(--slate-200);
        border-radius: 11px;
        background: white;
        color: var(--slate-800);
        outline: 0;
        transition:
          border-color 0.18s ease,
          box-shadow 0.18s ease;
      }

      .filter-input {
        min-width: 205px;
        min-height: 39px;
        padding: 8px 12px;
        font-size: 12px;
      }

      .field-input,
      .field-select {
        min-height: 43px;
        padding: 9px 11px;
      }

      .field-textarea {
        min-height: 84px;
        padding: 10px 11px;
        resize: vertical;
      }

      .filter-input:focus,
      .field-input:focus,
      .field-select:focus,
      .field-textarea:focus {
        border-color: #76acd8;
        box-shadow: 0 0 0 3px rgba(52, 127, 192, 0.1);
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .field {
        min-width: 0;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      .field-label {
        display: block;
        margin-bottom: 7px;
        color: var(--slate-700);
        font-size: 12px;
        font-weight: 680;
      }

      .required {
        margin-left: 3px;
        color: var(--red);
      }

      .field-help {
        margin: 6px 0 0;
        color: var(--slate-500);
        font-size: 11px;
      }

      .form-error {
        min-height: 18px;
        margin: 11px 0 0;
        color: var(--red);
        font-size: 12px;
      }

      .form-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 9px;
        margin-top: 20px;
      }

      .room-floors {
        display: grid;
        gap: 17px;
      }

      .floor-section {
        padding: 17px;
        border: 1px solid var(--slate-200);
        border-radius: 16px;
        background: var(--slate-50);
      }

      .floor-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .floor-heading h3 {
        margin: 0;
        color: var(--slate-700);
        font-size: 14px;
      }

      .floor-heading span {
        color: var(--slate-500);
        font-size: 11px;
      }

      .room-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .room-card {
        position: relative;
        min-height: 118px;
        padding: 15px;
        border: 1px solid var(--slate-200);
        border-radius: 14px;
        background: white;
        cursor: pointer;
        text-align: left;
        transition:
          transform 0.18s ease,
          border-color 0.18s ease,
          box-shadow 0.18s ease;
      }

      .room-card:hover {
        border-color: #bad5ea;
        box-shadow: 0 10px 22px rgba(20, 56, 95, 0.08);
        transform: translateY(-2px);
      }

      .room-card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .room-number {
        color: var(--slate-950);
        font-size: 17px;
        font-weight: 800;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 700;
      }

      .status::before {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }

      .status-occupied {
        background: var(--green-bg);
        color: var(--green);
      }

      .status-vacant {
        background: var(--amber-bg);
        color: var(--amber);
      }

      .room-tenant {
        overflow: hidden;
        margin: 14px 0 3px;
        color: var(--slate-700);
        font-size: 12px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .room-rent {
        color: var(--slate-500);
        font-size: 11px;
      }

      .data-table-wrap {
        overflow-x: auto;
        border: 1px solid var(--slate-200);
        border-radius: 14px;
      }

      .data-table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        font-size: 12px;
      }

      .data-table th,
      .data-table td {
        padding: 13px 14px;
        border-bottom: 1px solid var(--slate-100);
        text-align: left;
        vertical-align: middle;
        white-space: nowrap;
      }

      .data-table th {
        background: var(--slate-50);
        color: var(--slate-500);
        font-size: 11px;
        font-weight: 700;
      }

      .data-table td {
        color: var(--slate-700);
      }

      .data-table tbody tr:last-child td {
        border-bottom: 0;
      }

      .data-table tbody tr:hover {
        background: #fbfdff;
      }

      .table-primary {
        color: var(--slate-950);
        font-weight: 720;
      }

      .actions {
        display: flex;
        gap: 6px;
      }

      .empty-state {
        padding: 50px 20px;
        text-align: center;
      }

      .empty-icon {
        display: grid;
        width: 54px;
        height: 54px;
        margin: 0 auto 13px;
        place-items: center;
        border-radius: 17px;
        background: var(--blue-50);
        color: var(--blue-700);
        font-size: 19px;
        font-weight: 800;
      }

      .empty-state h3 {
        margin: 0;
        color: var(--slate-800);
        font-size: 15px;
      }

      .empty-state p {
        margin: 6px 0 16px;
        color: var(--slate-500);
        font-size: 12px;
      }

      .split-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
        gap: 15px;
        align-items: start;
      }

      .calc-box {
        padding: 17px;
        border: 1px solid #d5e6f4;
        border-radius: 15px;
        background: var(--blue-50);
      }

      .calc-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 7px 0;
        color: var(--slate-600);
        font-size: 12px;
      }

      .calc-row + .calc-row {
        border-top: 1px solid rgba(35, 104, 170, 0.1);
      }

      .calc-row strong {
        color: var(--slate-800);
      }

      .calc-row.total {
        margin-top: 3px;
        padding-top: 12px;
        color: var(--slate-800);
        font-weight: 700;
      }

      .calc-row.total strong {
        color: var(--blue-700);
        font-size: 19px;
      }

      .notice {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        margin-bottom: 15px;
        padding: 11px 13px;
        border: 1px solid #f1d9b8;
        border-radius: 11px;
        background: #fff9ef;
        color: #8b621e;
        font-size: 11px;
      }

      .danger-zone {
        margin-top: 18px;
        padding: 17px;
        border: 1px solid #f1ccd0;
        border-radius: 15px;
        background: #fffafa;
      }

      .danger-zone h3 {
        margin: 0 0 4px;
        color: var(--red);
        font-size: 14px;
      }

      .danger-zone p {
        margin: 0 0 12px;
        color: var(--slate-500);
        font-size: 11px;
      }

      dialog {
        width: min(92vw, 620px);
        max-height: 88vh;
        padding: 0;
        overflow: hidden;
        border: 0;
        border-radius: 20px;
        background: white;
        box-shadow: 0 32px 80px rgba(9, 28, 51, 0.28);
      }

      dialog::backdrop {
        background: rgba(8, 27, 50, 0.5);
        backdrop-filter: blur(3px);
      }

      .dialog-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 19px 21px;
        border-bottom: 1px solid var(--slate-100);
      }

      .dialog-title {
        margin: 0;
        color: var(--slate-950);
        font-size: 18px;
      }

      .dialog-close {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 10px;
        background: var(--slate-50);
        color: var(--slate-500);
        cursor: pointer;
        font-size: 20px;
      }

      .dialog-body {
        max-height: calc(88vh - 73px);
        overflow-y: auto;
        padding: 21px;
      }

      .confirm-dialog {
        width: min(90vw, 430px);
      }

      .confirm-dialog .dialog-body {
        padding-top: 5px;
      }

      .confirm-message {
        margin: 0;
        color: var(--slate-600);
        font-size: 13px;
        line-height: 1.75;
      }

      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 1400;
        min-width: 240px;
        max-width: min(90vw, 380px);
        padding: 13px 16px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 13px;
        background: var(--navy-950);
        color: white;
        box-shadow: var(--shadow-md);
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(16px);
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }

      .toast.visible {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 1180px) {
        .room-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .split-layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 920px) {
        .sidebar {
          width: min(82vw, 290px);
          transform: translateX(-105%);
          transition: transform 0.27s cubic-bezier(0.2, 0.75, 0.25, 1);
        }

        .sidebar.open {
          transform: translateX(0);
        }

        .drawer-overlay {
          position: fixed;
          inset: 0;
          z-index: 850;
          display: block;
          background: rgba(8, 27, 50, 0.46);
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.24s ease;
          backdrop-filter: blur(3px);
        }

        .drawer-overlay.visible {
          opacity: 1;
          pointer-events: auto;
        }

        .mobile-topbar {
          position: sticky;
          top: 0;
          z-index: 800;
          display: flex;
          min-height: 67px;
          align-items: center;
          justify-content: space-between;
          padding: 10px 17px;
          border-bottom: 1px solid rgba(203, 211, 223, 0.8);
          background: rgba(250, 252, 255, 0.91);
          backdrop-filter: blur(14px);
        }

        .mobile-brand {
          display: flex;
          align-items: center;
          gap: 9px;
          color: var(--navy-900);
          font-size: 15px;
          font-weight: 760;
        }

        .mobile-brand .brand-mark {
          width: 35px;
          height: 35px;
          flex-basis: 35px;
          border-radius: 11px;
          font-size: 20px;
        }

        .menu-button {
          display: grid;
          width: 41px;
          height: 41px;
          place-items: center;
          border: 1px solid var(--slate-200);
          border-radius: 11px;
          background: white;
          color: var(--navy-900);
          cursor: pointer;
          box-shadow: var(--shadow-sm);
        }

        .menu-lines,
        .menu-lines::before,
        .menu-lines::after {
          display: block;
          width: 18px;
          height: 2px;
          border-radius: 2px;
          background: currentColor;
          content: "";
        }

        .menu-lines {
          position: relative;
        }

        .menu-lines::before {
          position: absolute;
          top: -6px;
        }

        .menu-lines::after {
          position: absolute;
          top: 6px;
        }

        .main {
          margin-left: 0;
          padding: 20px 18px 44px;
        }

        .stats-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 680px) {
        .top-header {
          display: block;
        }

        .date-chip {
          display: inline-flex;
          margin-top: 13px;
        }

        .stats-grid {
          gap: 9px;
        }

        .stat-card {
          padding: 15px;
        }

        .stat-value {
          font-size: 22px;
        }

        .panel {
          border-radius: 18px;
        }

        .panel-header {
          display: block;
          padding: 18px 16px;
        }

        .panel-header .button {
          margin-top: 12px;
        }

        .panel-body {
          padding: 16px;
        }

        .room-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .room-card {
          min-height: 111px;
        }

        .field-grid {
          grid-template-columns: 1fr;
        }

        .field.full {
          grid-column: auto;
        }

        .data-table-wrap {
          overflow: visible;
          border: 0;
          border-radius: 0;
        }

        .data-table,
        .data-table tbody,
        .data-table tr,
        .data-table td {
          display: block;
          width: 100%;
        }

        .data-table thead {
          display: none;
        }

        .data-table tbody {
          display: grid;
          gap: 10px;
        }

        .data-table tr {
          padding: 13px 14px;
          border: 1px solid var(--slate-200);
          border-radius: 13px;
          background: white;
        }

        .data-table td {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          padding: 6px 0;
          border: 0;
          white-space: normal;
          text-align: right;
        }

        .data-table td::before {
          flex: 0 0 auto;
          color: var(--slate-500);
          content: attr(data-label);
          font-size: 10px;
          text-align: left;
        }

        .data-table td.actions-cell {
          display: block;
          padding-top: 10px;
          border-top: 1px solid var(--slate-100);
          text-align: left;
        }

        .data-table td.actions-cell::before {
          display: none;
        }

        .actions {
          flex-wrap: wrap;
        }

        dialog {
          width: min(94vw, 620px);
        }

        .toast {
          right: 14px;
          bottom: 14px;
          left: 14px;
          min-width: 0;
        }
      }

      @media (max-width: 410px) {
        .main {
          padding-inline: 12px;
        }

        .mobile-topbar {
          padding-inline: 13px;
        }

        .room-grid {
          grid-template-columns: 1fr;
        }

        .stats-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <aside class="sidebar" id="sidebar" aria-label="系统菜单">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">寓</span>
        <span>
          <span class="brand-name">房务通</span>
          <span class="brand-subtitle">SINGLE BUILDING</span>
        </span>
      </div>
      <div class="sidebar-scroll">
        <p class="nav-label">管理菜单</p>
        <nav id="sidebar-nav"></nav>
      </div>
      <div class="sidebar-status">
        <span>数据保存在当前设备</span>
        <strong id="sidebar-building">幸福公寓</strong>
      </div>
    </aside>

    <div class="drawer-overlay" id="drawer-overlay" aria-hidden="true"></div>

    <header class="mobile-topbar">
      <div class="mobile-brand">
        <span class="brand-mark" aria-hidden="true">寓</span>
        <span id="mobile-building">幸福公寓</span>
      </div>
      <button
        class="menu-button"
        id="menu-button"
        type="button"
        aria-label="打开系统菜单"
        aria-controls="sidebar"
        aria-expanded="false"
      >
        <span class="menu-lines" aria-hidden="true"></span>
      </button>
    </header>

    <main class="main" id="main-content">
      <div class="main-inner">
        <header class="top-header">
          <div>
            <div class="breadcrumb" id="breadcrumb"></div>
            <h1 class="page-title" id="page-title"></h1>
            <p class="page-description" id="page-description"></p>
          </div>
          <div class="date-chip">
            <b id="date-day"></b>
            <span id="date-full"></span>
          </div>
        </header>

        <section class="stats-grid" id="stats-grid" aria-label="楼栋概况"></section>
        <section id="view-container" aria-live="polite"></section>
      </div>
    </main>

    <dialog id="room-dialog" aria-labelledby="room-dialog-title">
      <div class="dialog-header">
        <h2 class="dialog-title" id="room-dialog-title">新增房间</h2>
        <button class="dialog-close" type="button" data-close-dialog="room-dialog" aria-label="关闭">×</button>
      </div>
      <div class="dialog-body">
        <form id="room-form" novalidate>
          <input type="hidden" id="room-id" name="roomId" />
          <div class="field-grid">
            <label class="field">
              <span class="field-label">房间号<span class="required">*</span></span>
              <input class="field-input" id="room-number" name="number" maxlength="12" required />
            </label>
            <label class="field">
              <span class="field-label">楼层<span class="required">*</span></span>
              <input class="field-input" id="room-floor" name="floor" type="number" min="1" max="99" required />
            </label>
            <label class="field">
              <span class="field-label">出租状态</span>
              <select class="field-select" id="room-status" name="status">
                <option value="vacant">空置</option>
                <option value="occupied">在租</option>
              </select>
            </label>
            <label class="field">
              <span class="field-label">月租（元）<span class="required">*</span></span>
              <input class="field-input" id="room-rent" name="monthlyRent" type="number" min="0" step="0.01" required />
            </label>
            <label class="field tenant-field">
              <span class="field-label">租客姓名<span class="required">*</span></span>
              <input class="field-input" id="room-tenant" name="tenantName" maxlength="30" />
            </label>
            <label class="field tenant-field">
              <span class="field-label">联系电话</span>
              <input class="field-input" id="room-phone" name="phone" maxlength="30" />
            </label>
            <label class="field tenant-field">
              <span class="field-label">入住日期</span>
              <input class="field-input" id="room-move-in" name="moveInDate" type="date" />
            </label>
            <label class="field full">
              <span class="field-label">备注</span>
              <textarea class="field-textarea" id="room-note" name="note" maxlength="300"></textarea>
            </label>
          </div>
          <p class="form-error" id="room-form-error" role="alert"></p>
          <div class="form-actions">
            <button class="button button-secondary" type="button" data-close-dialog="room-dialog">取消</button>
            <button class="button button-primary" type="submit">保存房间</button>
          </div>
        </form>
      </div>
    </dialog>

    <dialog class="confirm-dialog" id="confirm-dialog" aria-labelledby="confirm-title">
      <div class="dialog-header">
        <h2 class="dialog-title" id="confirm-title">请确认</h2>
        <button class="dialog-close" type="button" data-confirm-result="false" aria-label="关闭">×</button>
      </div>
      <div class="dialog-body">
        <p class="confirm-message" id="confirm-message"></p>
        <div class="form-actions">
          <button class="button button-secondary" type="button" data-confirm-result="false">取消</button>
          <button class="button button-danger" id="confirm-ok" type="button" data-confirm-result="true">确认</button>
        </div>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <canvas id="receipt-canvas" hidden></canvas>

    <script>
      const STORAGE_KEY = "fangwutong.single-building.v1";
      const CURRENT_PERIOD = toLocalDateInput(new Date()).slice(0, 7);

      const MENU = [
        {
          id: "rooms",
          label: "房间管理",
          icon: "房",
          items: [
            { id: "room-overview", label: "房间总览", description: "按楼层查看全部房间与当前出租状态" },
            { id: "room-occupied", label: "在租房间", description: "维护在租房间和租客档案" },
            { id: "room-vacant", label: "空置房间", description: "查看可出租房间并登记入住" },
            { id: "room-settings", label: "房间设置", description: "新增、编辑或删除房间" },
          ],
        },
        {
          id: "meters",
          label: "水电录入",
          icon: "表",
          items: [
            { id: "meter-entry", label: "本月录入", description: "录入水电读数并自动计算费用" },
            { id: "meter-records", label: "抄表记录", description: "查询和维护历史水电记录" },
            { id: "meter-settings", label: "费用设置", description: "设置水费与电费单价" },
          ],
        },
        {
          id: "receipts",
          label: "租金收据",
          icon: "据",
          items: [
            { id: "receipt-create", label: "开具收据", description: "生成并下载标准租金收据图片" },
            { id: "receipt-records", label: "收据记录", description: "查看、重下或删除历史收据" },
            { id: "receipt-settings", label: "模板设置", description: "设置楼栋、抬头与默认收款人" },
          ],
        },
      ];

      const viewContainer = document.getElementById("view-container");
      const sidebar = document.getElementById("sidebar");
      const sidebarNav = document.getElementById("sidebar-nav");
      const drawerOverlay = document.getElementById("drawer-overlay");
      const menuButton = document.getElementById("menu-button");
      const roomDialog = document.getElementById("room-dialog");
      const confirmDialog = document.getElementById("confirm-dialog");
      const toast = document.getElementById("toast");

      let state = loadState();
      let activeView = "room-overview";
      let expandedGroups = new Set(MENU.map((group) => group.id));
      let roomQuery = "";
      let meterPeriodFilter = CURRENT_PERIOD;
      let receiptPeriodFilter = CURRENT_PERIOD;
      let meterContext = { roomId: state.rooms[0]?.id || "", period: CURRENT_PERIOD };
      let receiptContext = { roomId: occupiedRooms()[0]?.id || "", period: CURRENT_PERIOD };
      let confirmResolver = null;
      let toastTimer = 0;
      let lastFocusedElement = null;

      function createDefaultState() {
        const rooms = [];
        for (let floor = 1; floor <= 6; floor += 1) {
          for (let unit = 1; unit <= 4; unit += 1) {
            rooms.push({
              id: makeId("room"),
              number: `${floor}0${unit}`,
              floor,
              status: "vacant",
              tenantName: "",
              phone: "",
              monthlyRent: 1200,
              moveInDate: "",
              note: "",
            });
          }
        }
        return {
          version: 1,
          settings: {
            buildingName: "幸福公寓",
            waterRate: 3.5,
            electricRate: 0.8,
            receiptTitle: "租金收款收据",
            payee: "房屋管理员",
          },
          rooms,
          meterRecords: [],
          receipts: [],
        };
      }

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved?.version === 1 && Array.isArray(saved.rooms)) {
            return {
              ...createDefaultState(),
              ...saved,
              settings: { ...createDefaultState().settings, ...saved.settings },
              meterRecords: Array.isArray(saved.meterRecords) ? saved.meterRecords : [],
              receipts: Array.isArray(saved.receipts) ? saved.receipts : [],
            };
          }
        } catch (error) {
          console.warn("本地数据读取失败，已使用默认数据。", error);
        }
        const initial = createDefaultState();
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
        } catch {}
        return initial;
      }

      function saveState(message = "") {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          if (message) showToast(message);
          renderChrome();
          return true;
        } catch {
          showToast("保存失败，请检查浏览器存储空间");
          return false;
        }
      }

      function makeId(prefix) {
        const id =
          globalThis.crypto?.randomUUID?.() ||
          `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        return `${prefix}-${id}`;
      }

      function toLocalDateInput(date) {
        const adjusted = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
        return adjusted.toISOString().slice(0, 10);
      }

      function formatMoney(value) {
        return Number(value || 0).toLocaleString("zh-CN", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }

      function formatDate(value) {
        if (!value) return "—";
        const [year, month, day] = value.split("-");
        return `${year}年${Number(month)}月${Number(day)}日`;
      }

      function formatPeriod(value) {
        if (!value) return "—";
        const [year, month] = value.split("-");
        return `${year}年${Number(month)}月`;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function occupiedRooms() {
        return state.rooms.filter((room) => room.status === "occupied");
      }

      function currentMenu() {
        for (const group of MENU) {
          const item = group.items.find((candidate) => candidate.id === activeView);
          if (item) return { group, item };
        }
        return { group: MENU[0], item: MENU[0].items[0] };
      }

      function renderChrome() {
        renderSidebar();
        renderHeader();
        renderStats();
        document.getElementById("sidebar-building").textContent = state.settings.buildingName;
        document.getElementById("mobile-building").textContent = state.settings.buildingName;
      }

      function renderSidebar() {
        const { group: activeGroup } = currentMenu();
        sidebarNav.innerHTML = MENU.map((group) => {
          const isOpen = expandedGroups.has(group.id);
          const isActive = group.id === activeGroup.id;
          return `
            <div class="nav-group">
              <button
                class="nav-parent${isActive ? " active" : ""}"
                type="button"
                data-toggle-group="${group.id}"
                aria-expanded="${isOpen}"
                aria-controls="${group.id}-children"
              >
                <span class="nav-parent-icon" aria-hidden="true">${group.icon}</span>
                <span class="nav-parent-title">${group.label}</span>
                <span class="nav-chevron" aria-hidden="true">⌄</span>
              </button>
              <div class="nav-children${isOpen ? " open" : ""}" id="${group.id}-children">
                ${group.items
                  .map(
                    (item) => `
                      <button
                        class="nav-child${item.id === activeView ? " active" : ""}"
                        type="button"
                        data-view="${item.id}"
                        aria-current="${item.id === activeView ? "page" : "false"}"
                      >${item.label}</button>
                    `,
                  )
                  .join("")}
              </div>
            </div>
          `;
        }).join("");
      }

      function renderHeader() {
        const { group, item } = currentMenu();
        document.getElementById("breadcrumb").innerHTML = `
          <span>${escapeHtml(state.settings.buildingName)}</span>
          <span class="breadcrumb-separator">/</span>
          <span>${group.label}</span>
        `;
        document.getElementById("page-title").textContent = item.label;
        document.getElementById("page-description").textContent = item.description;
        const now = new Date();
        document.getElementById("date-day").textContent = String(now.getDate()).padStart(2, "0");
        document.getElementById("date-full").textContent = now.toLocaleDateString("zh-CN", {
          year: "numeric",
          month: "long",
          weekday: "short",
        });
      }

      function renderStats() {
        const occupied = occupiedRooms().length;
        const vacant = state.rooms.length - occupied;
        const receiptedRoomIds = new Set(
          state.receipts
            .filter((receipt) => receipt.period === CURRENT_PERIOD)
            .map((receipt) => receipt.roomId),
        );
        const pending = occupiedRooms().filter((room) => !receiptedRoomIds.has(room.id)).length;
        document.getElementById("stats-grid").innerHTML = [
          ["房间总数", state.rooms.length, "间", "#e8f2fb", "#347fc0"],
          ["在租房间", occupied, "间", "#e9f7f1", "#247c5d"],
          ["空置房间", vacant, "间", "#fff3df", "#a86b1f"],
          ["本月待开收据", pending, "间", "#fff0f1", "#b54752"],
        ]
          .map(
            ([label, value, suffix, color, dot]) => `
              <article class="stat-card" style="--stat-color:${color};--stat-dot:${dot}">
                <span class="stat-label">${label}</span>
                <strong class="stat-value">${value}<span class="stat-suffix">${suffix}</span></strong>
              </article>
            `,
          )
          .join("");
      }

      function renderView() {
        const renderers = {
          "room-overview": renderRoomOverview,
          "room-occupied": () => renderRoomList("occupied"),
          "room-vacant": () => renderRoomList("vacant"),
          "room-settings": renderRoomSettings,
          "meter-entry": renderMeterEntry,
          "meter-records": renderMeterRecords,
          "meter-settings": renderMeterSettings,
          "receipt-create": renderReceiptCreate,
          "receipt-records": renderReceiptRecords,
          "receipt-settings": renderReceiptSettings,
        };
        viewContainer.innerHTML = (renderers[activeView] || renderRoomOverview)();
        syncDynamicCalculations();
      }

      function renderRoomOverview() {
        const floors = [...new Set(state.rooms.map((room) => Number(room.floor)))].sort(
          (a, b) => b - a,
        );
        if (!floors.length) return emptyState("房", "还没有房间", "请先在房间设置中新增房间。", "新增房间", "add-room");
        return `
          <section class="panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">${escapeHtml(state.settings.buildingName)}房态总览</h2>
                <p class="panel-subtitle">点击房间卡片即可编辑档案或办理入住、退租</p>
              </div>
              <button class="button button-primary" type="button" data-action="add-room">＋ 新增房间</button>
            </div>
            <div class="panel-body">
              <div class="room-floors">
                ${floors
                  .map((floor) => {
                    const rooms = state.rooms
                      .filter((room) => Number(room.floor) === floor)
                      .sort((a, b) => String(a.number).localeCompare(String(b.number), "zh-CN", { numeric: true }));
                    const occupied = rooms.filter((room) => room.status === "occupied").length;
                    return `
                      <section class="floor-section">
                        <div class="floor-heading">
                          <h3>${floor} 楼</h3>
                          <span>${occupied}/${rooms.length} 间在租</span>
                        </div>
                        <div class="room-grid">
                          ${rooms.map(roomCard).join("")}
                        </div>
                      </section>
                    `;
                  })
                  .join("")}
              </div>
            </div>
          </section>
        `;
      }

      function roomCard(room) {
        const occupied = room.status === "occupied";
        return `
          <button class="room-card" type="button" data-action="edit-room" data-room-id="${room.id}">
            <span class="room-card-top">
              <span class="room-number">${escapeHtml(room.number)}</span>
              <span class="status ${occupied ? "status-occupied" : "status-vacant"}">${occupied ? "在租" : "空置"}</span>
            </span>
            <span class="room-tenant">${occupied ? escapeHtml(room.tenantName) : "等待入住"}</span>
            <span class="room-rent">月租 ¥${formatMoney(room.monthlyRent)}</span>
          </button>
        `;
      }

      function filteredRooms(status = "") {
        const query = roomQuery.trim().toLowerCase();
        return state.rooms
          .filter((room) => !status || room.status === status)
          .filter(
            (room) =>
              !query ||
              [room.number, room.tenantName, room.phone]
                .join(" ")
                .toLowerCase()
                .includes(query),
          )
          .sort((a, b) => String(a.number).localeCompare(String(b.number), "zh-CN", { numeric: true }));
      }

      function renderRoomList(status) {
        const rooms = filteredRooms(status);
        const occupied = status === "occupied";
        return `
          <section class="panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">${occupied ? "在租房间" : "空置房间"}清单</h2>
                <p class="panel-subtitle">共 ${rooms.length} 间符合当前条件</p>
              </div>
              <button class="button button-primary" type="button" data-action="add-room" data-default-status="${status}">
                ${occupied ? "＋ 登记入住" : "＋ 新增空置房"}
              </button>
            </div>
            <div class="panel-body">
              <div class="toolbar">
                <input class="filter-input" id="room-search" type="search" placeholder="搜索房号、租客或电话" value="${escapeHtml(roomQuery)}" />
              </div>
              ${rooms.length ? roomTable(rooms, true) : emptyState("房", occupied ? "暂无在租房间" : "暂无空置房间", occupied ? "可点击“登记入住”建立租客档案。" : "当前所有房间均已出租。")}
            </div>
          </section>
        `;
      }

      function renderRoomSettings() {
        const rooms = filteredRooms();
        return `
          <section class="panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">房间档案设置</h2>
                <p class="panel-subtitle">管理楼层、房号、月租和租客资料</p>
              </div>
              <button class="button button-primary" type="button" data-action="add-room">＋ 新增房间</button>
            </div>
            <div class="panel-body">
              <div class="toolbar">
                <input class="filter-input" id="room-search" type="search" placeholder="搜索房号、租客或电话" value="${escapeHtml(roomQuery)}" />
              </div>
              ${rooms.length ? roomTable(rooms, true, true) : emptyState("房", "还没有房间", "点击上方按钮创建第一个房间。")}
              <div class="danger-zone">
                <h3>恢复默认数据</h3>
                <p>将清除当前设备上的房间、水电和收据记录，并重新生成24间默认房间。此操作不可撤销。</p>
                <button class="button button-danger" type="button" data-action="reset-data">恢复默认数据</button>
              </div>
            </div>
          </section>
        `;
      }

      function roomTable(rooms, showTenant, allowDelete = false) {
        return `
          <div class="data-table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>房间</th>
                  <th>楼层</th>
                  <th>状态</th>
                  ${showTenant ? "<th>租客</th><th>联系电话</th>" : ""}
                  <th>月租</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                ${rooms
                  .map(
                    (room) => `
                      <tr>
                        <td data-label="房间"><span class="table-primary">${escapeHtml(room.number)}</span></td>
                        <td data-label="楼层">${room.floor} 楼</td>
                        <td data-label="状态"><span class="status ${room.status === "occupied" ? "status-occupied" : "status-vacant"}">${room.status === "occupied" ? "在租" : "空置"}</span></td>
                        ${showTenant ? `<td data-label="租客">${escapeHtml(room.tenantName || "—")}</td><td data-label="联系电话">${escapeHtml(room.phone || "—")}</td>` : ""}
                        <td data-label="月租">¥${formatMoney(room.monthlyRent)}</td>
                        <td class="actions-cell" data-label="操作">
                          <div class="actions">
                            <button class="button button-soft button-small" type="button" data-action="edit-room" data-room-id="${room.id}">编辑</button>
                            ${allowDelete ? `<button class="button button-danger button-small" type="button" data-action="delete-room" data-room-id="${room.id}">删除</button>` : ""}
                          </div>
                        </td>
                      </tr>
                    `,
                  )
                  .join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function latestReading(roomId, period) {
        return state.meterRecords
          .filter((record) => record.roomId === roomId && record.period < period)
          .sort((a, b) => b.period.localeCompare(a.period))[0];
      }

      function currentMeterRecord() {
        return state.meterRecords.find(
          (record) =>
            record.roomId === meterContext.roomId && record.period === meterContext.period,
        );
      }

      function renderMeterEntry() {
        if (!state.rooms.length) return emptyState("表", "暂无可抄表房间", "请先在房间设置中新增房间。");
        if (!meterContext.roomId || !state.rooms.some((room) => room.id === meterContext.roomId)) {
          meterContext.roomId = state.rooms[0].id;
        }
        const existing = currentMeterRecord();
        const previous = latestReading(meterContext.roomId, meterContext.period);
        const prevWater = existing?.prevWater ?? previous?.currentWater ?? 0;
        const currentWater = existing?.currentWater ?? prevWater;
        const prevElectric = existing?.prevElectric ?? previous?.currentElectric ?? 0;
        const currentElectric = existing?.currentElectric ?? prevElectric;
        return `
          <div class="split-layout">
            <section class="panel">
              <div class="panel-header">
                <div>
                  <h2 class="panel-title">${existing ? "更新本期抄表" : "录入本期抄表"}</h2>
                  <p class="panel-subtitle">同一房间同一月份仅保留一条记录</p>
                </div>
              </div>
              <div class="panel-body">
                <form id="meter-form" novalidate>
                  <div class="field-grid">
                    <label class="field">
                      <span class="field-label">账期<span class="required">*</span></span>
                      <input class="field-input" id="meter-period" name="period" type="month" value="${meterContext.period}" required />
                    </label>
                    <label class="field">
                      <span class="field-label">房间<span class="required">*</span></span>
                      <select class="field-select" id="meter-room" name="roomId" required>
                        ${state.rooms
                          .slice()
                          .sort((a, b) => String(a.number).localeCompare(String(b.number), "zh-CN", { numeric: true }))
                          .map((room) => `<option value="${room.id}" ${room.id === meterContext.roomId ? "selected" : ""}>${escapeHtml(room.number)}${room.tenantName ? ` · ${escapeHtml(room.tenantName)}` : ""}</option>`)
                          .join("")}
                      </select>
                    </label>
                    <label class="field">
                      <span class="field-label">上期水表</span>
                      <input class="field-input meter-number" id="prev-water" name="prevWater" type="number" min="0" step="0.01" value="${prevWater}" required />
                    </label>
                    <label class="field">
                      <span class="field-label">本期水表<span class="required">*</span></span>
                      <input class="field-input meter-number" id="current-water" name="currentWater" type="number" min="0" step="0.01" value="${currentWater}" required />
                    </label>
                    <label class="field">
                      <span class="field-label">上期电表</span>
                      <input class="field-input meter-number" id="prev-electric" name="prevElectric" type="number" min="0" step="0.01" value="${prevElectric}" required />
                    </label>
                    <label class="field">
                      <span class="field-label">本期电表<span class="required">*</span></span>
                      <input class="field-input meter-number" id="current-electric" name="currentElectric" type="number" min="0" step="0.01" value="${currentElectric}" required />
                    </label>
                  </div>
                  <p class="form-error" id="meter-form-error" role="alert"></p>
                  <div class="form-actions">
                    <button class="button button-primary" type="submit">${existing ? "更新记录" : "保存记录"}</button>
                  </div>
                </form>
              </div>
            </section>
            <aside class="panel">
              <div class="panel-header">
                <div>
                  <h2 class="panel-title">费用试算</h2>
                  <p class="panel-subtitle">按当前设置的单价自动计算</p>
                </div>
              </div>
              <div class="panel-body">
                <div class="calc-box" id="meter-calculation">
                  ${meterCalculationMarkup(prevWater, currentWater, prevElectric, currentElectric)}
                </div>
                <p class="field-help">水费 ¥${formatMoney(state.settings.waterRate)}/吨，电费 ¥${formatMoney(state.settings.electricRate)}/度。</p>
              </div>
            </aside>
          </div>
        `;
      }

      function meterCalculationMarkup(prevWater, currentWater, prevElectric, currentElectric) {
        const waterUsage = Math.max(0, Number(currentWater) - Number(prevWater));
        const electricUsage = Math.max(0, Number(currentElectric) - Number(prevElectric));
        const waterCharge = waterUsage * Number(state.settings.waterRate);
        const electricCharge = electricUsage * Number(state.settings.electricRate);
        return `
          <div class="calc-row"><span>水量 ${waterUsage.toFixed(2)} 吨</span><strong>¥${formatMoney(waterCharge)}</strong></div>
          <div class="calc-row"><span>电量 ${electricUsage.toFixed(2)} 度</span><strong>¥${formatMoney(electricCharge)}</strong></div>
          <div class="calc-row total"><span>水电合计</span><strong>¥${formatMoney(waterCharge + electricCharge)}</strong></div>
        `;
      }

      function renderMeterRecords() {
        const records = state.meterRecords
          .filter((record) => !meterPeriodFilter || record.period === meterPeriodFilter)
          .sort((a, b) => b.period.localeCompare(a.period) || roomNumber(a.roomId).localeCompare(roomNumber(b.roomId), "zh-CN", { numeric: true }));
        return `
          <section class="panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">抄表记录</h2>
                <p class="panel-subtitle">查询、修改或删除历史水电数据</p>
              </div>
              <button class="button button-primary" type="button" data-view="meter-entry">＋ 录入水电</button>
            </div>
            <div class="panel-body">
              <div class="toolbar">
                <div class="toolbar-group">
                  <label class="sr-only" for="meter-filter-period">筛选账期</label>
                  <input class="filter-input" id="meter-filter-period" type="month" value="${meterPeriodFilter}" />
                  <button class="button button-secondary" type="button" data-action="clear-meter-filter">查看全部</button>
                </div>
              </div>
              ${records.length ? meterTable(records) : emptyState("表", "暂无抄表记录", "可前往“本月录入”建立第一条记录。", "录入水电", "go-meter-entry")}
            </div>
          </section>
        `;
      }

      function meterTable(records) {
        return `
          <div class="data-table-wrap">
            <table class="data-table">
              <thead><tr><th>账期</th><th>房间</th><th>用水</th><th>水费</th><th>用电</th><th>电费</th><th>合计</th><th>操作</th></tr></thead>
              <tbody>
                ${records
                  .map(
                    (record) => `
                      <tr>
                        <td data-label="账期"><span class="table-primary">${formatPeriod(record.period)}</span></td>
                        <td data-label="房间">${escapeHtml(roomNumber(record.roomId))}</td>
                        <td data-label="用水">${Number(record.waterUsage).toFixed(2)} 吨</td>
                        <td data-label="水费">¥${formatMoney(record.waterCharge)}</td>
                        <td data-label="用电">${Number(record.electricUsage).toFixed(2)} 度</td>
                        <td data-label="电费">¥${formatMoney(record.electricCharge)}</td>
                        <td data-label="合计">¥${formatMoney(Number(record.waterCharge) + Number(record.electricCharge))}</td>
                        <td class="actions-cell" data-label="操作">
                          <div class="actions">
                            <button class="button button-soft button-small" type="button" data-action="edit-meter" data-record-id="${record.id}">编辑</button>
                            <button class="button button-danger button-small" type="button" data-action="delete-meter" data-record-id="${record.id}">删除</button>
                          </div>
                        </td>
                      </tr>
                    `,
                  )
                  .join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderMeterSettings() {
        return `
          <section class="panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">水电费用设置</h2>
                <p class="panel-subtitle">新保存的抄表记录将使用最新单价</p>
              </div>
            </div>
            <div class="panel-body">
              <form id="meter-settings-form">
                <div class="field-grid">
                  <label class="field">
                    <span class="field-label">水费单价（元/吨）</span>
                    <input class="field-input" name="waterRate" type="number" min="0" step="0.01" value="${state.settings.waterRate}" required />
                  </label>
                  <label class="field">
                    <span class="field-label">电费单价（元/度）</span>
                    <input class="field-input" name="electricRate" type="number" min="0" step="0.01" value="${state.settings.electricRate}" required />
                  </label>
                </div>
                <p class="field-help">历史记录会保留录入时的单价和费用，不会被重新计算。</p>
                <div class="form-actions">
                  <button class="button button-primary" type="submit">保存费用设置</button>
                </div>
              </form>
            </div>
          </section>
        `;
      }

      function renderReceiptCreate() {
        const rooms = occupiedRooms().sort((a, b) =>
          String(a.number).localeCompare(String(b.number), "zh-CN", { numeric: true }),
        );
        if (!rooms.length) return emptyState("据", "暂无在租房间", "请先在房间管理中为房间登记入住。", "前往在租房间", "go-occupied");
        if (!receiptContext.roomId || !rooms.some((room) => room.id === receiptContext.roomId)) {
          receiptContext.roomId = rooms[0].id;
        }
        const room = rooms.find((candidate) => candidate.id === receiptContext.roomId);
        const meter = state.meterRecords.find(
          (record) =>
            record.roomId === receiptContext.roomId &&
            record.period === receiptContext.period,
        );
        const existing = state.receipts.find(
          (receipt) =>
            receipt.roomId === receiptContext.roomId &&
            receipt.period === receiptContext.period,
        );
        const waterCharge = meter?.waterCharge ?? 0;
        const electricCharge = meter?.electricCharge ?? 0;
        return `
          <div class="split-layout">
            <section class="panel">
              <div class="panel-header">
                <div>
                  <h2 class="panel-title">开具租金收据</h2>
                  <p class="panel-subtitle">保存后将自动下载高清 PNG 图片</p>
                </div>
              </div>
              <div class="panel-body">
                ${!meter ? `<div class="notice"><strong>提示：</strong><span>${formatPeriod(receiptContext.period)}暂无水电记录，水费和电费已按0元带入，仍可手动调整后开具。</span></div>` : ""}
                ${existing ? `<div class="notice"><strong>注意：</strong><span>该房间本账期已开具收据（${escapeHtml(existing.serial)}），请从收据记录中重新下载。</span></div>` : ""}
                <form id="receipt-form" novalidate>
                  <div class="field-grid">
                    <label class="field">
                      <span class="field-label">账期<span class="required">*</span></span>
                      <input class="field-input" id="receipt-period" name="period" type="month" value="${receiptContext.period}" required />
                    </label>
                    <label class="field">
                      <span class="field-label">房间<span class="required">*</span></span>
                      <select class="field-select" id="receipt-room" name="roomId" required>
                        ${rooms.map((candidate) => `<option value="${candidate.id}" ${candidate.id === room.id ? "selected" : ""}>${escapeHtml(candidate.number)} · ${escapeHtml(candidate.tenantName)}</option>`).join("")}
                      </select>
                    </label>
                    <label class="field">
                      <span class="field-label">租客姓名</span>
                      <input class="field-input" name="tenantName" value="${escapeHtml(room.tenantName)}" required />
                    </label>
                    <label class="field">
                      <span class="field-label">租金（元）</span>
                      <input class="field-input receipt-amount" id="receipt-rent" name="rent" type="number" min="0" step="0.01" value="${Number(room.monthlyRent)}" required />
                    </label>
                    <label class="field">
                      <span class="field-label">水费（元）</span>
                      <input class="field-input receipt-amount" id="receipt-water" name="waterCharge" type="number" min="0" step="0.01" value="${Number(waterCharge).toFixed(2)}" required />
                    </label>
                    <label class="field">
                      <span class="field-label">电费（元）</span>
                      <input class="field-input receipt-amount" id="receipt-electric" name="electricCharge" type="number" min="0" step="0.01" value="${Number(electricCharge).toFixed(2)}" required />
                    </label>
                    <label class="field">
                      <span class="field-label">其他费用（元）</span>
                      <input class="field-input receipt-amount" id="receipt-other" name="otherAmount" type="number" min="0" step="0.01" value="0.00" required />
                    </label>
                    <label class="field">
                      <span class="field-label">支付方式</span>
                      <select class="field-select" name="paymentMethod">
                        <option>微信</option>
                        <option>支付宝</option>
                        <option>银行转账</option>
                        <option>现金</option>
                        <option>其他</option>
                      </select>
                    </label>
                    <label class="field">
                      <span class="field-label">收款日期</span>
                      <input class="field-input" name="receivedAt" type="date" value="${toLocalDateInput(new Date())}" required />
                    </label>
                    <label class="field">
                      <span class="field-label">收款人</span>
                      <input class="field-input" name="payee" value="${escapeHtml(state.settings.payee)}" required />
                    </label>
                    <label class="field full">
                      <span class="field-label">备注</span>
                      <textarea class="field-textarea" name="note" maxlength="200" placeholder="可填写费用说明或付款备注"></textarea>
                    </label>
                  </div>
                  <p class="form-error" id="receipt-form-error" role="alert"></p>
                  <div class="form-actions">
                    <button class="button button-primary" type="submit" ${existing ? "disabled" : ""}>保存并下载收据</button>
                  </div>
                </form>
              </div>
            </section>
            <aside class="panel">
              <div class="panel-header">
                <div>
                  <h2 class="panel-title">收据金额</h2>
                  <p class="panel-subtitle">费用变更后实时更新</p>
                </div>
              </div>
              <div class="panel-body">
                <div class="calc-box" id="receipt-calculation">
                  ${receiptCalculationMarkup(room.monthlyRent, waterCharge, electricCharge, 0)}
                </div>
              </div>
            </aside>
          </div>
        `;
      }

      function receiptCalculationMarkup(rent, water, electric, other) {
        const total = [rent, water, electric, other].reduce(
          (sum, value) => sum + Math.max(0, Number(value) || 0),
          0,
        );
        return `
          <div class="calc-row"><span>月租</span><strong>¥${formatMoney(rent)}</strong></div>
          <div class="calc-row"><span>水费</span><strong>¥${formatMoney(water)}</strong></div>
          <div class="calc-row"><span>电费</span><strong>¥${formatMoney(electric)}</strong></div>
          <div class="calc-row"><span>其他费用</span><strong>¥${formatMoney(other)}</strong></div>
          <div class="calc-row total"><span>应收合计</span><strong>¥${formatMoney(total)}</strong></div>
        `;
      }

      function renderReceiptRecords() {
        const receipts = state.receipts
          .filter((receipt) => !receiptPeriodFilter || receipt.period === receiptPeriodFilter)
          .sort((a, b) => b.receivedAt.localeCompare(a.receivedAt) || b.serial.localeCompare(a.serial));
        return `
          <section class="panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">租金收据记录</h2>
                <p class="panel-subtitle">历史收据可随时重新生成并下载</p>
              </div>
              <button class="button button-primary" type="button" data-view="receipt-create">＋ 开具收据</button>
            </div>
            <div class="panel-body">
              <div class="toolbar">
                <div class="toolbar-group">
                  <label class="sr-only" for="receipt-filter-period">筛选账期</label>
                  <input class="filter-input" id="receipt-filter-period" type="month" value="${receiptPeriodFilter}" />
                  <button class="button button-secondary" type="button" data-action="clear-receipt-filter">查看全部</button>
                </div>
              </div>
              ${receipts.length ? receiptTable(receipts) : emptyState("据", "暂无收据记录", "开具后，收据会保存在当前设备。", "开具收据", "go-receipt-create")}
            </div>
          </section>
        `;
      }

      function receiptTable(receipts) {
        return `
          <div class="data-table-wrap">
            <table class="data-table">
              <thead><tr><th>收据编号</th><th>账期</th><th>房间</th><th>租客</th><th>合计</th><th>收款日期</th><th>操作</th></tr></thead>
              <tbody>
                ${receipts
                  .map(
                    (receipt) => `
                      <tr>
                        <td data-label="收据编号"><span class="table-primary">${escapeHtml(receipt.serial)}</span></td>
                        <td data-label="账期">${formatPeriod(receipt.period)}</td>
                        <td data-label="房间">${escapeHtml(receipt.roomNumber)}</td>
                        <td data-label="租客">${escapeHtml(receipt.tenantName)}</td>
                        <td data-label="合计">¥${formatMoney(receipt.total)}</td>
                        <td data-label="收款日期">${formatDate(receipt.receivedAt)}</td>
                        <td class="actions-cell" data-label="操作">
                          <div class="actions">
                            <button class="button button-soft button-small" type="button" data-action="download-receipt" data-receipt-id="${receipt.id}">下载图片</button>
                            <button class="button button-danger button-small" type="button" data-action="delete-receipt" data-receipt-id="${receipt.id}">删除</button>
                          </div>
                        </td>
                      </tr>
                    `,
                  )
                  .join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderReceiptSettings() {
        return `
          <section class="panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">收据模板设置</h2>
                <p class="panel-subtitle">这些信息会显示在新生成的收据图片中</p>
              </div>
            </div>
            <div class="panel-body">
              <form id="receipt-settings-form">
                <div class="field-grid">
                  <label class="field">
                    <span class="field-label">楼栋名称</span>
                    <input class="field-input" name="buildingName" maxlength="40" value="${escapeHtml(state.settings.buildingName)}" required />
                  </label>
                  <label class="field">
                    <span class="field-label">收据抬头</span>
                    <input class="field-input" name="receiptTitle" maxlength="40" value="${escapeHtml(state.settings.receiptTitle)}" required />
                  </label>
                  <label class="field">
                    <span class="field-label">默认收款人</span>
                    <input class="field-input" name="payee" maxlength="30" value="${escapeHtml(state.settings.payee)}" required />
                  </label>
                </div>
                <div class="form-actions">
                  <button class="button button-primary" type="submit">保存模板设置</button>
                </div>
              </form>
            </div>
          </section>
        `;
      }

      function emptyState(icon, title, description, buttonLabel = "", action = "") {
        return `
          <div class="empty-state">
            <span class="empty-icon" aria-hidden="true">${icon}</span>
            <h3>${title}</h3>
            <p>${description}</p>
            ${buttonLabel ? `<button class="button button-primary" type="button" data-action="${action}">${buttonLabel}</button>` : ""}
          </div>
        `;
      }

      function roomNumber(roomId) {
        return state.rooms.find((room) => room.id === roomId)?.number || "已删除房间";
      }

      function navigate(viewId) {
        if (!MENU.some((group) => group.items.some((item) => item.id === viewId))) return;
        activeView = viewId;
        const group = MENU.find((candidate) =>
          candidate.items.some((item) => item.id === viewId),
        );
        expandedGroups.add(group.id);
        renderChrome();
        renderView();
        closeDrawer(false);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function openRoomDialog(roomId = "", defaultStatus = "vacant") {
        const room = state.rooms.find((candidate) => candidate.id === roomId);
        document.getElementById("room-dialog-title").textContent = room ? "编辑房间" : defaultStatus === "occupied" ? "登记入住" : "新增房间";
        document.getElementById("room-id").value = room?.id || "";
        document.getElementById("room-number").value = room?.number || "";
        document.getElementById("room-floor").value = room?.floor || "";
        document.getElementById("room-status").value = room?.status || defaultStatus;
        document.getElementById("room-rent").value = room?.monthlyRent ?? 1200;
        document.getElementById("room-tenant").value = room?.tenantName || "";
        document.getElementById("room-phone").value = room?.phone || "";
        document.getElementById("room-move-in").value = room?.moveInDate || "";
        document.getElementById("room-note").value = room?.note || "";
        document.getElementById("room-form-error").textContent = "";
        syncTenantFields();
        lastFocusedElement = document.activeElement;
        roomDialog.showModal();
        window.setTimeout(() => document.getElementById("room-number").focus(), 30);
      }

      function syncTenantFields() {
        const occupied = document.getElementById("room-status").value === "occupied";
        document.querySelectorAll(".tenant-field").forEach((field) => {
          field.style.opacity = occupied ? "1" : "0.55";
        });
        document.getElementById("room-tenant").required = occupied;
      }

      function closeDialog(dialog) {
        if (dialog?.open) dialog.close();
        lastFocusedElement?.focus?.();
      }

      function askConfirm(message, confirmLabel = "确认删除") {
        document.getElementById("confirm-message").textContent = message;
        document.getElementById("confirm-ok").textContent = confirmLabel;
        lastFocusedElement = document.activeElement;
        confirmDialog.showModal();
        document.getElementById("confirm-ok").focus();
        return new Promise((resolve) => {
          confirmResolver = resolve;
        });
      }

      function resolveConfirm(result) {
        if (!confirmResolver) return;
        const resolver = confirmResolver;
        confirmResolver = null;
        confirmDialog.close();
        resolver(result);
        lastFocusedElement?.focus?.();
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add("visible");
        toastTimer = window.setTimeout(() => toast.classList.remove("visible"), 2600);
      }

      function openDrawer() {
        lastFocusedElement = document.activeElement;
        sidebar.classList.add("open");
        drawerOverlay.classList.add("visible");
        drawerOverlay.setAttribute("aria-hidden", "false");
        menuButton.setAttribute("aria-expanded", "true");
        menuButton.setAttribute("aria-label", "关闭系统菜单");
        document.body.classList.add("drawer-open");
        window.setTimeout(() => sidebar.querySelector("button")?.focus(), 30);
      }

      function closeDrawer(restoreFocus = true) {
        if (!sidebar.classList.contains("open")) return;
        sidebar.classList.remove("open");
        drawerOverlay.classList.remove("visible");
        drawerOverlay.setAttribute("aria-hidden", "true");
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "打开系统菜单");
        document.body.classList.remove("drawer-open");
        if (restoreFocus) (lastFocusedElement || menuButton).focus();
      }

      function syncDynamicCalculations() {
        const meterBox = document.getElementById("meter-calculation");
        if (meterBox) {
          meterBox.innerHTML = meterCalculationMarkup(
            document.getElementById("prev-water")?.value || 0,
            document.getElementById("current-water")?.value || 0,
            document.getElementById("prev-electric")?.value || 0,
            document.getElementById("current-electric")?.value || 0,
          );
        }
        const receiptBox = document.getElementById("receipt-calculation");
        if (receiptBox) {
          receiptBox.innerHTML = receiptCalculationMarkup(
            document.getElementById("receipt-rent")?.value || 0,
            document.getElementById("receipt-water")?.value || 0,
            document.getElementById("receipt-electric")?.value || 0,
            document.getElementById("receipt-other")?.value || 0,
          );
        }
      }

      function nextReceiptSerial(period) {
        const prefix = `RENT-${period.replace("-", "")}-`;
        const max = state.receipts
          .filter((receipt) => receipt.serial.startsWith(prefix))
          .reduce((highest, receipt) => {
            const sequence = Number(receipt.serial.slice(prefix.length));
            return Math.max(highest, Number.isFinite(sequence) ? sequence : 0);
          }, 0);
        return `${prefix}${String(max + 1).padStart(3, "0")}`;
      }

      function downloadReceiptImage(receipt) {
        const canvas = document.getElementById("receipt-canvas");
        canvas.width = 1600;
        canvas.height = 1080;
        const ctx = canvas.getContext("2d");
        const font = '"Microsoft YaHei", "PingFang SC", sans-serif';

        ctx.fillStyle = "#f4f8fc";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(72, 62, 1456, 956);
        ctx.strokeStyle = "#173b67";
        ctx.lineWidth = 4;
        ctx.strokeRect(72, 62, 1456, 956);
        ctx.strokeStyle = "#b8c9da";
        ctx.lineWidth = 2;
