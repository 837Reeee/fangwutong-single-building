<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="房务通出租屋信息导航中心，集中管理房源、租客、合同、账务、维修与常用工具。"
    />
    <meta name="theme-color" content="#163b68" />
    <title>房务通 · 出租屋信息导航</title>
    <style>
      :root {
        --navy-950: #0d2849;
        --navy-900: #12345d;
        --navy-800: #174777;
        --blue-700: #2366a8;
        --blue-600: #2f78bd;
        --blue-100: #e7f1fb;
        --blue-50: #f3f8fd;
        --slate-950: #172033;
        --slate-800: #303b51;
        --slate-600: #667085;
        --slate-500: #7b879b;
        --slate-300: #cbd3df;
        --slate-200: #e2e7ee;
        --slate-100: #edf1f6;
        --slate-50: #f6f8fb;
        --white: #ffffff;
        --green: #2b8a67;
        --amber: #be7a22;
        --danger: #b64b55;
        --sidebar-width: 272px;
        --shadow-sm: 0 1px 2px rgba(26, 39, 61, 0.04),
          0 5px 16px rgba(26, 39, 61, 0.05);
        --shadow-md: 0 16px 38px rgba(16, 46, 82, 0.1);
        --radius-lg: 24px;
        --radius-md: 16px;
        --radius-sm: 12px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        scroll-padding-top: 24px;
      }

      body {
        margin: 0;
        min-width: 320px;
        background:
          radial-gradient(circle at 76% 0%, rgba(59, 130, 196, 0.07), transparent 28rem),
          var(--slate-50);
        color: var(--slate-950);
        font-family:
          "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC",
          "Segoe UI", sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      body.drawer-open {
        overflow: hidden;
      }

      button,
      input {
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      button {
        border: 0;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      :focus-visible {
        outline: 3px solid rgba(47, 120, 189, 0.36);
        outline-offset: 3px;
      }

      .skip-link {
        position: fixed;
        left: 18px;
        top: 14px;
        z-index: 1100;
        padding: 10px 15px;
        border-radius: 10px;
        background: var(--white);
        color: var(--navy-900);
        box-shadow: var(--shadow-md);
        transform: translateY(-160%);
        transition: transform 0.2s ease;
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      .app-shell {
        min-height: 100vh;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 900;
        display: flex;
        width: var(--sidebar-width);
        flex-direction: column;
        overflow: hidden;
        background:
          radial-gradient(circle at 16% 6%, rgba(112, 179, 232, 0.18), transparent 13rem),
          linear-gradient(165deg, var(--navy-900), var(--navy-950) 74%);
        color: rgba(255, 255, 255, 0.84);
        box-shadow: 8px 0 30px rgba(13, 40, 73, 0.08);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 13px;
        min-height: 94px;
        padding: 24px 24px 20px;
      }

      .brand-mark {
        display: grid;
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 14px;
        background: linear-gradient(145deg, #4c95d2, #2468a8);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.3),
          0 10px 24px rgba(1, 19, 40, 0.22);
        color: white;
        font-size: 27px;
        line-height: 1;
      }

      .brand-copy {
        min-width: 0;
      }

      .brand-name {
        display: block;
        color: var(--white);
        font-size: 20px;
        font-weight: 750;
        letter-spacing: 0.04em;
      }

      .brand-slogan {
        display: block;
        margin-top: 2px;
        color: rgba(255, 255, 255, 0.5);
        font-size: 12px;
        letter-spacing: 0.08em;
      }

      .nav-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px 24px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
      }

      .nav-label {
        margin: 3px 12px 11px;
        color: rgba(255, 255, 255, 0.38);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
      }

      .sidebar-nav {
        display: grid;
        gap: 7px;
      }

      .nav-button {
        position: relative;
        display: grid;
        width: 100%;
        min-height: 54px;
        grid-template-columns: 36px 1fr auto;
        align-items: center;
        gap: 11px;
        padding: 8px 13px;
        border-radius: 13px;
        background: transparent;
        color: rgba(255, 255, 255, 0.68);
        cursor: pointer;
        text-align: left;
        transition:
          transform 0.2s ease,
          color 0.2s ease,
          background 0.2s ease;
      }

      .nav-button::before {
        position: absolute;
        left: -16px;
        width: 3px;
        height: 24px;
        border-radius: 0 4px 4px 0;
        background: #78b8ed;
        content: "";
        opacity: 0;
        transform: scaleY(0.4);
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }

      .nav-button:hover {
        background: rgba(255, 255, 255, 0.07);
        color: white;
        transform: translateX(2px);
      }

      .nav-button.active {
        background: linear-gradient(90deg, rgba(81, 153, 211, 0.24), rgba(255, 255, 255, 0.07));
        color: white;
      }

      .nav-button.active::before {
        opacity: 1;
        transform: scaleY(1);
      }

      .nav-icon {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.07);
        font-size: 15px;
        font-weight: 750;
      }

      .nav-button.active .nav-icon {
        border-color: rgba(118, 184, 237, 0.32);
        background: rgba(86, 161, 219, 0.22);
      }

      .nav-title {
        font-size: 14px;
        font-weight: 650;
      }

      .nav-index {
        color: rgba(255, 255, 255, 0.28);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
      }

      .sidebar-footer {
        margin: 0 16px 18px;
        padding: 15px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.05);
      }

      .sidebar-footer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: rgba(255, 255, 255, 0.74);
        font-size: 12px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #62d5ab;
        box-shadow: 0 0 0 4px rgba(98, 213, 171, 0.11);
      }

      .sidebar-footer strong {
        display: block;
        margin-top: 8px;
        color: white;
        font-size: 18px;
      }

      .sidebar-footer small {
        color: rgba(255, 255, 255, 0.4);
        font-size: 11px;
      }

      .mobile-topbar {
        display: none;
      }

      .drawer-overlay {
        position: fixed;
        inset: 0;
        z-index: 850;
        background: rgba(8, 25, 47, 0.46);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        backdrop-filter: blur(3px);
      }

      .drawer-overlay.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .main-content {
        min-height: 100vh;
        margin-left: var(--sidebar-width);
        padding: 28px clamp(24px, 3.3vw, 56px) 56px;
      }

      .content-shell {
        width: min(100%, 1460px);
        margin: 0 auto;
      }

      .hero {
        position: relative;
        overflow: hidden;
        padding: clamp(26px, 4vw, 44px);
        border-radius: var(--radius-lg);
        background:
          radial-gradient(circle at 88% 18%, rgba(108, 180, 235, 0.27), transparent 16rem),
          linear-gradient(125deg, var(--navy-900), #1c5687);
        color: white;
        box-shadow: var(--shadow-md);
      }

      .hero::before,
      .hero::after {
        position: absolute;
        border: 1px solid rgba(255, 255, 255, 0.11);
        border-radius: 50%;
        content: "";
        pointer-events: none;
      }

      .hero::before {
        top: -94px;
        right: -58px;
        width: 290px;
        height: 290px;
      }

      .hero::after {
        right: 150px;
        bottom: -138px;
        width: 250px;
        height: 250px;
      }

      .hero-content {
        position: relative;
        z-index: 1;
        max-width: 940px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 10px;
        color: #aed6f4;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }

      .eyebrow::before {
        width: 18px;
        height: 2px;
        border-radius: 2px;
        background: #74b6e8;
        content: "";
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 43px);
        font-weight: 780;
        letter-spacing: -0.03em;
        line-height: 1.18;
      }

      .hero-description {
        max-width: 650px;
        margin: 12px 0 25px;
        color: rgba(255, 255, 255, 0.66);
        font-size: 14px;
      }

      .search-panel {
        display: flex;
        align-items: stretch;
        width: min(100%, 880px);
        min-height: 58px;
        padding: 6px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 17px;
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 15px 36px rgba(4, 24, 49, 0.22);
      }

      .engine-switcher {
        display: flex;
        align-items: center;
        gap: 3px;
        padding: 0 5px 0 2px;
        border-right: 1px solid var(--slate-200);
      }

      .engine-button {
        min-width: 54px;
        padding: 9px 10px;
        border-radius: 10px;
        background: transparent;
        color: var(--slate-500);
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
        transition:
          color 0.18s ease,
          background 0.18s ease;
      }

      .engine-button:hover {
        background: var(--slate-50);
        color: var(--navy-900);
      }

      .engine-button.active {
        background: var(--blue-100);
        color: var(--blue-700);
      }

      .search-input-wrap {
        display: flex;
        min-width: 0;
        flex: 1;
        align-items: center;
        gap: 10px;
        padding-left: 15px;
      }

      .search-symbol {
        color: var(--slate-500);
        font-size: 21px;
        line-height: 1;
      }

      .search-input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--slate-950);
        font-size: 15px;
      }

      .search-input::placeholder {
        color: #98a2b3;
      }

      .search-submit {
        min-width: 98px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--blue-700), var(--navy-800));
        color: white;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 6px 15px rgba(35, 102, 168, 0.2);
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease;
      }

      .search-submit:hover {
        box-shadow: 0 9px 20px rgba(35, 102, 168, 0.28);
        transform: translateY(-1px);
      }

      .search-submit:active {
        transform: translateY(1px);
      }

      .search-hint {
        min-height: 18px;
        margin: 9px 4px 0;
        color: #f4c992;
        font-size: 12px;
        opacity: 0;
        transition: opacity 0.18s ease;
      }

      .search-hint.visible {
        opacity: 1;
      }

      .overview-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin: 18px 0 34px;
      }

      .overview-item {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 17px 19px;
        border: 1px solid var(--slate-200);
        border-radius: var(--radius-md);
        background: rgba(255, 255, 255, 0.84);
        box-shadow: var(--shadow-sm);
      }

      .overview-icon {
        display: grid;
        width: 40px;
        height: 40px;
        flex: 0 0 40px;
        place-items: center;
        border-radius: 12px;
        background: var(--blue-100);
        color: var(--blue-700);
        font-size: 15px;
        font-weight: 800;
      }

      .overview-item:nth-child(2) .overview-icon {
        background: #e8f6f0;
        color: var(--green);
      }

      .overview-item:nth-child(3) .overview-icon {
        background: #fff3e4;
        color: var(--amber);
      }

      .overview-copy strong {
        display: block;
        color: var(--slate-800);
        font-size: 14px;
      }

      .overview-copy span {
        color: var(--slate-500);
        font-size: 12px;
      }

      .category-section {
        scroll-margin-top: 28px;
        margin-top: 22px;
        padding: clamp(22px, 3vw, 32px);
        border: 1px solid rgba(203, 211, 223, 0.72);
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.91);
        box-shadow: var(--shadow-sm);
      }

      .category-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
      }

      .category-heading {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .category-mark {
        display: grid;
        width: 48px;
        height: 48px;
        flex: 0 0 48px;
        place-items: center;
        border: 1px solid #d7e8f7;
        border-radius: 14px;
        background: linear-gradient(145deg, #f4f9fe, #e4f0fa);
        color: var(--blue-700);
        font-size: 17px;
        font-weight: 800;
        box-shadow: inset 0 1px 0 white;
      }

      .category-kicker {
        display: block;
        margin-bottom: 3px;
        color: var(--blue-600);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.16em;
      }

      .category-title {
        margin: 0;
        color: var(--slate-950);
        font-size: clamp(21px, 2.4vw, 27px);
        line-height: 1.2;
      }

      .category-description {
        max-width: 470px;
        margin: 5px 0 0;
        color: var(--slate-500);
        font-size: 13px;
      }

      .category-count {
        flex: 0 0 auto;
        padding: 7px 11px;
        border: 1px solid var(--slate-200);
        border-radius: 999px;
        background: var(--slate-50);
        color: var(--slate-500);
        font-size: 11px;
        font-weight: 650;
      }

      .tabs {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        margin-bottom: 19px;
        padding: 4px;
        border: 1px solid var(--slate-200);
        border-radius: 13px;
        background: var(--slate-50);
        scrollbar-width: none;
      }

      .tabs::-webkit-scrollbar {
        display: none;
      }

      .tab-button {
        flex: 0 0 auto;
        padding: 9px 15px;
        border-radius: 9px;
        background: transparent;
        color: var(--slate-600);
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
        transition:
          color 0.18s ease,
          background 0.18s ease,
          box-shadow 0.18s ease;
      }

      .tab-button:hover {
        color: var(--navy-900);
      }

      .tab-button[aria-selected="true"] {
        background: white;
        color: var(--blue-700);
        box-shadow: 0 3px 10px rgba(22, 59, 104, 0.08);
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 13px;
      }

      .nav-card {
        position: relative;
        display: grid;
        min-height: 116px;
        grid-template-columns: 48px minmax(0, 1fr) 22px;
        align-items: start;
        gap: 13px;
        padding: 20px;
        border: 1px solid var(--slate-200);
        border-radius: var(--radius-md);
        background: white;
        box-shadow: 0 2px 8px rgba(28, 46, 70, 0.03);
        transition:
          transform 0.22s ease,
          border-color 0.22s ease,
          box-shadow 0.22s ease;
      }

      .nav-card:hover {
        border-color: #bdd7ec;
        box-shadow: 0 14px 28px rgba(23, 71, 119, 0.1);
        transform: translateY(-3px);
      }

      .nav-card:active {
        transform: translateY(-1px);
      }

      .card-icon {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border-radius: 14px;
        background: var(--blue-50);
        color: var(--blue-700);
        font-size: 16px;
        font-weight: 800;
        transition:
          color 0.22s ease,
          background 0.22s ease,
          transform 0.22s ease;
      }

      .nav-card:hover .card-icon {
        background: var(--blue-700);
        color: white;
        transform: scale(1.04);
      }

      .card-copy {
        min-width: 0;
      }

      .card-title {
        display: block;
        margin: 1px 0 6px;
        color: var(--slate-800);
        font-size: 15px;
        font-weight: 750;
      }

      .card-description {
        display: -webkit-box;
        overflow: hidden;
        margin: 0;
        color: var(--slate-500);
        font-size: 12px;
        line-height: 1.65;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .card-arrow {
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        margin-top: 1px;
        border-radius: 7px;
        color: var(--slate-300);
        font-size: 17px;
        transition:
          color 0.2s ease,
          background 0.2s ease,
          transform 0.2s ease;
      }

      .nav-card:hover .card-arrow {
        background: var(--blue-50);
        color: var(--blue-700);
        transform: translate(2px, -2px);
      }

      .card-grid.is-changing {
        opacity: 0;
        transform: translateY(5px);
      }

      .card-grid {
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
      }

      .page-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 30px 4px 0;
        color: var(--slate-500);
        font-size: 12px;
      }

      .page-footer strong {
        color: var(--slate-800);
      }

      @media (max-width: 1180px) {
        .card-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 900px) {
        html {
          scroll-padding-top: 86px;
        }

        .sidebar {
          width: min(82vw, 286px);
          transform: translateX(-105%);
          transition: transform 0.27s cubic-bezier(0.2, 0.75, 0.25, 1);
        }

        .sidebar.open {
          transform: translateX(0);
        }

        .mobile-topbar {
          position: sticky;
          top: 0;
          z-index: 800;
          display: flex;
          min-height: 68px;
          align-items: center;
          justify-content: space-between;
          padding: 10px 18px;
          border-bottom: 1px solid rgba(203, 211, 223, 0.82);
          background: rgba(250, 252, 255, 0.9);
          backdrop-filter: blur(14px);
        }

        .mobile-brand {
          display: flex;
          align-items: center;
          gap: 10px;
          color: var(--navy-900);
          font-size: 16px;
          font-weight: 750;
        }

        .mobile-brand .brand-mark {
          width: 36px;
          height: 36px;
          flex-basis: 36px;
          border-radius: 11px;
          font-size: 21px;
        }

        .menu-button {
          display: grid;
          width: 42px;
          height: 42px;
          place-items: center;
          border: 1px solid var(--slate-200);
          border-radius: 12px;
          background: white;
          color: var(--navy-900);
          cursor: pointer;
          box-shadow: var(--shadow-sm);
        }

        .menu-lines,
        .menu-lines::before,
        .menu-lines::after {
          display: block;
          width: 18px;
          height: 2px;
          border-radius: 2px;
          background: currentColor;
          content: "";
        }

        .menu-lines {
          position: relative;
        }

        .menu-lines::before {
          position: absolute;
          top: -6px;
        }

        .menu-lines::after {
          position: absolute;
          top: 6px;
        }

        .main-content {
          margin-left: 0;
          padding: 18px 18px 44px;
        }

        .category-section {
          scroll-margin-top: 86px;
        }
      }

      @media (max-width: 720px) {
        .hero {
          padding: 25px 20px 20px;
          border-radius: 20px;
        }

        .hero-description {
          margin-bottom: 20px;
        }

        .search-panel {
          display: grid;
          min-height: auto;
          gap: 6px;
          padding: 7px;
        }

        .engine-switcher {
          justify-content: stretch;
          padding: 0 0 6px;
          border-right: 0;
          border-bottom: 1px solid var(--slate-200);
        }

        .engine-button {
          flex: 1;
        }

        .search-input-wrap {
          min-height: 47px;
          padding: 0 10px;
        }

        .search-submit {
          min-height: 45px;
        }

        .overview-strip {
          grid-template-columns: 1fr;
          gap: 9px;
          margin-bottom: 26px;
        }

        .overview-item {
          padding: 13px 15px;
        }

        .category-section {
          padding: 21px 16px;
          border-radius: 19px;
        }

          return `
            <section
              class="category-section"
              id="${category.id}"
              data-section="${category.id}"
              aria-labelledby="${category.id}-title"
            >
              <header class="category-header">
                <div class="category-heading">
                  <span class="category-mark" aria-hidden="true">${category.icon}</span>
                  <div>
                    <span class="category-kicker">MODULE ${String(categoryIndex + 1).padStart(2, "0")}</span>
                    <h2 class="category-title" id="${category.id}-title">${category.title}</h2>
                    <p class="category-description">${category.description}</p>
                  </div>
                </div>
                <span class="category-count">${category.tabs.length} 个分类 · ${totalCards} 个入口</span>
              </header>

              <div
                class="tabs"
                role="tablist"
                aria-label="${category.title}二级分类"
                data-category="${category.id}"
              >
                ${category.tabs
                  .map(
                    (tab) => `
                      <button
                        class="tab-button"
                        id="${tab.id}-tab"
                        type="button"
                        role="tab"
                        data-tab="${tab.id}"
                        aria-selected="${tab.id === selectedTabId}"
                        aria-controls="${category.id}-panel"
                        tabindex="${tab.id === selectedTabId ? "0" : "-1"}"
                      >
                        ${tab.label}
                      </button>
                    `,
                  )
                  .join("")}
              </div>

              <div
                class="card-grid"
                id="${category.id}-panel"
                role="tabpanel"
                aria-labelledby="${selectedTabId}-tab"
                data-panel="${category.id}"
              >
                ${selectedTab.cards.map(cardMarkup).join("")}
              </div>
            </section>
          `;
        }).join("");
      }

      function updateActiveSection(sectionId) {
        if (!sectionId || activeSection === sectionId) return;
        activeSection = sectionId;

        sidebarNav.querySelectorAll(".nav-button").forEach((button) => {
          const isActive = button.dataset.target === sectionId;
          button.classList.toggle("active", isActive);
          button.setAttribute("aria-current", isActive ? "location" : "false");
        });
      }

      function switchTab(categoryId, tabId, focusTab = false) {
        const category = NAV_DATA.find((item) => item.id === categoryId);
        const tab = category?.tabs.find((item) => item.id === tabId);
        if (!category || !tab || selectedTabs[categoryId] === tabId) {
          if (focusTab) document.getElementById(`${tabId}-tab`)?.focus();
          return;
        }

        selectedTabs[categoryId] = tabId;
        const tablist = document.querySelector(`.tabs[data-category="${categoryId}"]`);
        const panel = document.querySelector(`[data-panel="${categoryId}"]`);

        tablist.querySelectorAll('[role="tab"]').forEach((button) => {
          const isSelected = button.dataset.tab === tabId;
          button.setAttribute("aria-selected", String(isSelected));
          button.tabIndex = isSelected ? 0 : -1;
        });

        panel.classList.add("is-changing");
        window.setTimeout(() => {
          panel.innerHTML = tab.cards.map(cardMarkup).join("");
          panel.setAttribute("aria-labelledby", `${tabId}-tab`);
          panel.classList.remove("is-changing");
        }, reduceMotion.matches ? 0 : 120);

        if (focusTab) document.getElementById(`${tabId}-tab`)?.focus();
      }

      function openDrawer() {
        if (window.innerWidth > 900 || sidebar.classList.contains("open")) return;
        lastFocusedElement = document.activeElement;
        sidebar.classList.add("open");
        drawerOverlay.classList.add("visible");
        drawerOverlay.setAttribute("aria-hidden", "false");
        menuButton.setAttribute("aria-expanded", "true");
        menuButton.setAttribute("aria-label", "关闭导航菜单");
        document.body.classList.add("drawer-open");
        window.setTimeout(() => sidebarNav.querySelector(".nav-button")?.focus(), 40);
      }

      function closeDrawer(restoreFocus = true) {
        if (!sidebar.classList.contains("open")) return;
        sidebar.classList.remove("open");
        drawerOverlay.classList.remove("visible");
        drawerOverlay.setAttribute("aria-hidden", "true");
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "打开导航菜单");
        document.body.classList.remove("drawer-open");
        if (restoreFocus) (lastFocusedElement || menuButton).focus();
      }

      function trapDrawerFocus(event) {
        if (event.key !== "Tab" || !sidebar.classList.contains("open")) return;
        const focusable = Array.from(
          sidebar.querySelectorAll('button:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])'),
        );
        if (!focusable.length) return;

        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }

      renderSearchEngines();
      renderSidebar();
      renderCategories();

      engineSwitcher.addEventListener("click", (event) => {
        const button = event.target.closest("[data-engine]");
        if (!button) return;
        selectedEngine = button.dataset.engine;
        engineSwitcher.querySelectorAll(".engine-button").forEach((item) => {
          const isActive = item.dataset.engine === selectedEngine;
          item.classList.toggle("active", isActive);
          item.setAttribute("aria-pressed", String(isActive));
        });
        searchInput.focus();
      });

      searchInput.addEventListener("input", () => {
        searchHint.classList.remove("visible");
      });

      searchForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const query = searchInput.value.trim();
        if (!query) {
          searchHint.classList.add("visible");
          searchInput.focus();
          return;
        }

        const engine = SEARCH_ENGINES.find((item) => item.id === selectedEngine);
        const searchWindow = window.open(
          `${engine.url}${encodeURIComponent(query)}`,
          "_blank",
          "noopener,noreferrer",
        );
        if (searchWindow) searchWindow.opener = null;
      });

      sidebarNav.addEventListener("click", (event) => {
        const button = event.target.closest("[data-target]");
        if (!button) return;
        const target = document.getElementById(button.dataset.target);
        updateActiveSection(button.dataset.target);
        target?.scrollIntoView({
          behavior: reduceMotion.matches ? "auto" : "smooth",
          block: "start",
        });
        if (window.innerWidth <= 900) closeDrawer(false);
      });

      categoryContainer.addEventListener("click", (event) => {
        const button = event.target.closest("[data-tab]");
        if (!button) return;
        const tablist = button.closest("[data-category]");
        switchTab(tablist.dataset.category, button.dataset.tab);
      });

      categoryContainer.addEventListener("keydown", (event) => {
        const currentTab = event.target.closest('[role="tab"]');
        if (!currentTab) return;
        const tablist = currentTab.closest('[role="tablist"]');
        const tabs = Array.from(tablist.querySelectorAll('[role="tab"]'));
        const currentIndex = tabs.indexOf(currentTab);
        let nextIndex = currentIndex;

        if (event.key === "ArrowRight") nextIndex = (currentIndex + 1) % tabs.length;
        if (event.key === "ArrowLeft") nextIndex = (currentIndex - 1 + tabs.length) % tabs.length;
        if (event.key === "Home") nextIndex = 0;
        if (event.key === "End") nextIndex = tabs.length - 1;
        if (nextIndex === currentIndex) return;

        event.preventDefault();
        switchTab(tablist.dataset.category, tabs[nextIndex].dataset.tab, true);
      });

      menuButton.addEventListener("click", () => {
        sidebar.classList.contains("open") ? closeDrawer() : openDrawer();
      });

      drawerOverlay.addEventListener("click", () => closeDrawer());

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeDrawer();
        trapDrawerFocus(event);
      });

      window.addEventListener("resize", () => {
        if (window.innerWidth > 900) closeDrawer(false);
      });

      const sections = Array.from(document.querySelectorAll("[data-section]"));
      const observer = new IntersectionObserver(
        (entries) => {
          const visibleEntries = entries
            .filter((entry) => entry.isIntersecting)
            .sort((a, b) => b.intersectionRatio - a.intersectionRatio);
          if (visibleEntries[0]) updateActiveSection(visibleEntries[0].target.id);
        },
        {
          rootMargin: "-14% 0px -62% 0px",
          threshold: [0.05, 0.2, 0.45],
        },
      );
      sections.forEach((section) => observer.observe(section));

      let scrollFrame = 0;
      window.addEventListener(
        "scroll",
        () => {
          if (scrollFrame) return;
          scrollFrame = window.requestAnimationFrame(() => {
            scrollFrame = 0;
            const referenceLine = window.innerWidth <= 900 ? 118 : 72;
            const current =
              [...sections]
                .reverse()
                .find((section) => section.getBoundingClientRect().top <= referenceLine) ||
              sections[0];
            updateActiveSection(current?.id);
          });
        },
        { passive: true },
      );
    </script>
  </body>
</html>
