<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="面向单栋出租楼的房间、水电和租金收据管理工具。"
    />
    <meta name="theme-color" content="#173b67" />
    <title>房务通 · 单栋出租楼管理</title>
    <style>
      :root {
        --navy-950: #0d294b;
        --navy-900: #14385f;
        --navy-800: #194a78;
        --blue-700: #2368aa;
        --blue-600: #347fc0;
        --blue-100: #e8f2fb;
        --blue-50: #f3f8fd;
        --slate-950: #182235;
        --slate-800: #344054;
        --slate-700: #475467;
        --slate-600: #667085;
        --slate-500: #7c889a;
        --slate-300: #cbd3df;
        --slate-200: #e1e7ef;
        --slate-100: #edf1f6;
        --slate-50: #f6f8fb;
        --white: #fff;
        --green: #247c5d;
        --green-bg: #e9f7f1;
        --amber: #a86b1f;
        --amber-bg: #fff3df;
        --red: #b54752;
        --red-bg: #fff0f1;
        --sidebar: 278px;
        --shadow-sm: 0 1px 2px rgba(20, 56, 95, 0.04),
          0 5px 16px rgba(20, 56, 95, 0.05);
        --shadow-md: 0 18px 44px rgba(13, 41, 75, 0.13);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background:
          radial-gradient(circle at 88% 0, rgba(52, 127, 192, 0.08), transparent 32rem),
          var(--slate-50);
        color: var(--slate-950);
        font-family:
          "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC",
          "Segoe UI", sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      body.drawer-open {
        overflow: hidden;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
      }

      button,
      a,
      select {
        -webkit-tap-highlight-color: transparent;
      }

      :focus-visible {
        outline: 3px solid rgba(52, 127, 192, 0.3);
        outline-offset: 2px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      .skip-link {
        position: fixed;
        left: 18px;
        top: 14px;
        z-index: 1200;
        padding: 10px 14px;
        border-radius: 10px;
        background: white;
        color: var(--navy-900);
        box-shadow: var(--shadow-md);
        transform: translateY(-160%);
        transition: transform 0.2s ease;
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 900;
        display: flex;
        width: var(--sidebar);
        flex-direction: column;
        overflow: hidden;
        background:
          radial-gradient(circle at 10% 3%, rgba(105, 178, 231, 0.2), transparent 14rem),
          linear-gradient(165deg, var(--navy-900), var(--navy-950) 76%);
        color: rgba(255, 255, 255, 0.78);
        box-shadow: 8px 0 32px rgba(13, 41, 75, 0.08);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 13px;
        min-height: 94px;
        padding: 23px 23px 19px;
      }

      .brand-mark {
        display: grid;
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.26);
        border-radius: 14px;
        background: linear-gradient(145deg, #4b97d5, #2466a3);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.3),
          0 10px 24px rgba(1, 19, 40, 0.2);
        color: white;
        font-size: 25px;
        line-height: 1;
      }

      .brand-name {
        display: block;
        color: white;
        font-size: 19px;
        font-weight: 780;
        letter-spacing: 0.04em;
      }

      .brand-subtitle {
        display: block;
        margin-top: 2px;
        color: rgba(255, 255, 255, 0.45);
        font-size: 11px;
        letter-spacing: 0.1em;
      }

      .sidebar-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 8px 15px 24px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.17) transparent;
      }

      .nav-label {
        margin: 4px 11px 11px;
        color: rgba(255, 255, 255, 0.34);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      .nav-group + .nav-group {
        margin-top: 7px;
      }

      .nav-parent {
        display: grid;
        width: 100%;
        min-height: 53px;
        grid-template-columns: 35px 1fr 20px;
        align-items: center;
        gap: 11px;
        padding: 8px 12px;
        border-radius: 13px;
        background: transparent;
        color: rgba(255, 255, 255, 0.72);
        cursor: pointer;
        text-align: left;
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }

      .nav-parent:hover,
      .nav-parent.active {
        background: rgba(255, 255, 255, 0.08);
        color: white;
      }

      .nav-parent-icon {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        font-size: 14px;
        font-weight: 800;
      }

      .nav-parent.active .nav-parent-icon {
        border-color: rgba(105, 181, 237, 0.36);
        background: rgba(72, 148, 207, 0.22);
      }

      .nav-parent-title {
        font-size: 14px;
        font-weight: 680;
      }

      .nav-chevron {
        color: rgba(255, 255, 255, 0.35);
        font-size: 16px;
        transform: rotate(-90deg);
        transition: transform 0.2s ease;
      }

      .nav-parent[aria-expanded="true"] .nav-chevron {
        transform: rotate(0);
      }

      .nav-children {
        display: grid;
        max-height: 0;
        gap: 3px;
        overflow: hidden;
        padding: 0 4px 0 48px;
        opacity: 0;
        transition:
          max-height 0.25s ease,
          opacity 0.2s ease,
          padding 0.25s ease;
      }

      .nav-children.open {
        max-height: 230px;
        padding-top: 6px;
        padding-bottom: 5px;
        opacity: 1;
      }

      .nav-child {
        position: relative;
        width: 100%;
        padding: 8px 10px;
        border-radius: 9px;
        background: transparent;
        color: rgba(255, 255, 255, 0.47);
        cursor: pointer;
        text-align: left;
        font-size: 12px;
        transition:
          color 0.18s ease,
          background 0.18s ease;
      }

      .nav-child::before {
        position: absolute;
        left: -15px;
        top: 50%;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        content: "";
        transform: translateY(-50%);
      }

      .nav-child:hover {
        color: rgba(255, 255, 255, 0.85);
      }

      .nav-child.active {
        background: rgba(83, 159, 218, 0.16);
        color: #b8dcf7;
        font-weight: 680;
      }

      .sidebar-status {
        margin: 0 16px 18px;
        padding: 14px 15px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.05);
      }

      .sidebar-status span {
        display: flex;
        align-items: center;
        gap: 8px;
        color: rgba(255, 255, 255, 0.52);
        font-size: 11px;
      }

      .sidebar-status span::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #62d5ab;
        box-shadow: 0 0 0 4px rgba(98, 213, 171, 0.1);
        content: "";
      }

      .sidebar-status strong {
        display: block;
        margin-top: 7px;
        color: white;
        font-size: 15px;
      }

      .mobile-topbar,
      .drawer-overlay {
        display: none;
      }

      .main {
        min-height: 100vh;
        margin-left: var(--sidebar);
        padding: 27px clamp(24px, 3.2vw, 52px) 52px;
      }

      .main-inner {
        width: min(100%, 1440px);
        margin: 0 auto;
      }

      .top-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
      }

      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 6px;
        color: var(--slate-500);
        font-size: 12px;
      }

      .breadcrumb-separator {
        color: var(--slate-300);
      }

      .page-title {
        margin: 0;
        color: var(--slate-950);
        font-size: clamp(25px, 3vw, 33px);
        font-weight: 780;
        letter-spacing: -0.025em;
        line-height: 1.22;
      }

      .page-description {
        margin: 7px 0 0;
        color: var(--slate-500);
        font-size: 13px;
      }

      .date-chip {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 9px;
        padding: 10px 13px;
        border: 1px solid var(--slate-200);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.82);
        color: var(--slate-600);
        box-shadow: var(--shadow-sm);
        font-size: 12px;
      }

      .date-chip b {
        color: var(--blue-700);
        font-size: 15px;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 13px;
        margin-bottom: 20px;
      }

      .stat-card {
        position: relative;
        overflow: hidden;
        padding: 18px 19px;
        border: 1px solid rgba(203, 211, 223, 0.74);
        border-radius: 17px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: var(--shadow-sm);
      }

      .stat-card::after {
        position: absolute;
        right: -15px;
        bottom: -22px;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: var(--stat-color, var(--blue-100));
        content: "";
        opacity: 0.65;
      }

      .stat-label {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--slate-500);
        font-size: 12px;
      }

      .stat-label::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--stat-dot, var(--blue-600));
        content: "";
      }

      .stat-value {
        display: block;
        margin-top: 7px;
        color: var(--slate-950);
        font-size: 25px;
        font-weight: 800;
        line-height: 1.1;
      }

      .stat-suffix {
        margin-left: 3px;
        color: var(--slate-500);
        font-size: 11px;
        font-weight: 500;
      }

      .panel {
        border: 1px solid rgba(203, 211, 223, 0.76);
        border-radius: 21px;
        background: rgba(255, 255, 255, 0.93);
        box-shadow: var(--shadow-sm);
      }

      .panel + .panel {
        margin-top: 15px;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 20px 22px;
        border-bottom: 1px solid var(--slate-100);
      }

      .panel-title {
        margin: 0;
        color: var(--slate-800);
        font-size: 17px;
        font-weight: 760;
      }

      .panel-subtitle {
        margin: 4px 0 0;
        color: var(--slate-500);
        font-size: 12px;
      }

      .panel-body {
        padding: 22px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .toolbar-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 9px;
      }

      .button {
        display: inline-flex;
        min-height: 39px;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 8px 14px;
        border: 1px solid transparent;
        border-radius: 11px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 680;
        transition:
          transform 0.17s ease,
          box-shadow 0.17s ease,
          border-color 0.17s ease,
          background 0.17s ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button:active {
        transform: translateY(0);
      }

      .button-primary {
        background: linear-gradient(135deg, var(--blue-700), var(--navy-800));
        color: white;
        box-shadow: 0 7px 16px rgba(35, 104, 170, 0.18);
      }

      .button-secondary {
        border-color: var(--slate-200);
        background: white;
        color: var(--slate-700);
      }

      .button-soft {
        background: var(--blue-50);
        color: var(--blue-700);
      }

      .button-danger {
        border-color: #f1ccd0;
        background: var(--red-bg);
        color: var(--red);
      }

      .button-small {
        min-height: 32px;
        padding: 6px 10px;
        border-radius: 9px;
        font-size: 11px;
      }

      .button:disabled {
        cursor: not-allowed;
        opacity: 0.52;
        transform: none;
        box-shadow: none;
      }

      .selection-count {
        color: var(--slate-500);
        font-size: 11px;
        white-space: nowrap;
      }

      .selection-check {
        display: inline-grid;
        width: 18px;
        height: 18px;
        margin: 0;
        place-items: center;
        accent-color: var(--blue-700);
        cursor: pointer;
      }

      .receipt-select-cell {
        width: 46px;
        text-align: center !important;
      }

      .filter-input,
      .field-input,
      .field-select,
      .field-textarea {
        width: 100%;
        border: 1px solid var(--slate-200);
        border-radius: 11px;
        background: white;
        color: var(--slate-800);
        outline: 0;
        transition:
          border-color 0.18s ease,
          box-shadow 0.18s ease;
      }

      .filter-input {
        min-width: 205px;
        min-height: 39px;
        padding: 8px 12px;
        font-size: 12px;
      }

      .field-input,
      .field-select {
        min-height: 43px;
        padding: 9px 11px;
      }

      .field-textarea {
        min-height: 84px;
        padding: 10px 11px;
        resize: vertical;
      }

      .filter-input:focus,
      .field-input:focus,
      .field-select:focus,
      .field-textarea:focus {
        border-color: #76acd8;
        box-shadow: 0 0 0 3px rgba(52, 127, 192, 0.1);
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .field {
        min-width: 0;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      .field-label {
        display: block;
        margin-bottom: 7px;
        color: var(--slate-700);
        font-size: 12px;
        font-weight: 680;
      }

      .required {
        margin-left: 3px;
        color: var(--red);
      }

      .field-help {
        margin: 6px 0 0;
        color: var(--slate-500);
        font-size: 11px;
      }

      .form-error {
        min-height: 18px;
        margin: 11px 0 0;
        color: var(--red);
        font-size: 12px;
      }

      .form-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 9px;
        margin-top: 20px;
      }

      .room-floors {
        display: grid;
        gap: 17px;
      }

      .floor-section {
        padding: 17px;
        border: 1px solid var(--slate-200);
        border-radius: 16px;
        background: var(--slate-50);
      }

      .floor-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .floor-heading h3 {
        margin: 0;
        color: var(--slate-700);
        font-size: 14px;
      }

      .floor-heading span {
        color: var(--slate-500);
        font-size: 11px;
      }

      .room-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .room-card {
        position: relative;
        min-height: 118px;
        padding: 15px;
        border: 1px solid var(--slate-200);
        border-radius: 14px;
        background: white;
        cursor: pointer;
        text-align: left;
        transition:
          transform 0.18s ease,
          border-color 0.18s ease,
          box-shadow 0.18s ease;
      }

      .room-card:hover {
        border-color: #bad5ea;
        box-shadow: 0 10px 22px rgba(20, 56, 95, 0.08);
        transform: translateY(-2px);
      }

      .room-card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .room-number {
        color: var(--slate-950);
        font-size: 17px;
        font-weight: 800;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 700;
      }

      .status::before {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }

      .status-occupied {
        background: var(--green-bg);
        color: var(--green);
      }

      .status-vacant {
        background: var(--amber-bg);
        color: var(--amber);
      }

      .room-tenant {
        overflow: hidden;
        margin: 14px 0 3px;
        color: var(--slate-700);
        font-size: 12px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .room-rent {
        color: var(--slate-500);
        font-size: 11px;
      }

      .data-table-wrap {
        overflow-x: auto;
        border: 1px solid var(--slate-200);
        border-radius: 14px;
      }

      .data-table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        font-size: 12px;
      }

      .data-table th,
      .data-table td {
        padding: 13px 14px;
        border-bottom: 1px solid var(--slate-100);
        text-align: left;
        vertical-align: middle;
        white-space: nowrap;
      }

      .data-table th {
        background: var(--slate-50);
        color: var(--slate-500);
        font-size: 11px;
        font-weight: 700;
      }

      .data-table td {
        color: var(--slate-700);
      }

      .data-table tbody tr:last-child td {
        border-bottom: 0;
      }

      .data-table tbody tr:hover {
        background: #fbfdff;
      }

      .table-primary {
        color: var(--slate-950);
        font-weight: 720;
      }

      .actions {
        display: flex;
        gap: 6px;
      }

      .empty-state {
        padding: 50px 20px;
        text-align: center;
      }

      .empty-icon {
        display: grid;
        width: 54px;
        height: 54px;
        margin: 0 auto 13px;
        place-items: center;
        border-radius: 17px;
        background: var(--blue-50);
        color: var(--blue-700);
        font-size: 19px;
        font-weight: 800;
      }

      .empty-state h3 {
        margin: 0;
        color: var(--slate-800);
        font-size: 15px;
      }

      .empty-state p {
        margin: 6px 0 16px;
        color: var(--slate-500);
        font-size: 12px;
      }

      .split-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
        gap: 15px;
        align-items: start;
      }

      .calc-box {
        padding: 17px;
        border: 1px solid #d5e6f4;
        border-radius: 15px;
        background: var(--blue-50);
      }

      .calc-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 7px 0;
        color: var(--slate-600);
        font-size: 12px;
      }

      .calc-row + .calc-row {
        border-top: 1px solid rgba(35, 104, 170, 0.1);
      }

      .calc-row strong {
        color: var(--slate-800);
      }

      .calc-row.total {
        margin-top: 3px;
        padding-top: 12px;
        color: var(--slate-800);
        font-weight: 700;
      }

      .calc-row.total strong {
        color: var(--blue-700);
        font-size: 19px;
      }

      .notice {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        margin-bottom: 15px;
        padding: 11px 13px;
        border: 1px solid #f1d9b8;
        border-radius: 11px;
        background: #fff9ef;
        color: #8b621e;
        font-size: 11px;
      }

      .danger-zone {
        margin-top: 18px;
        padding: 17px;
        border: 1px solid #f1ccd0;
        border-radius: 15px;
        background: #fffafa;
      }

      .danger-zone h3 {
        margin: 0 0 4px;
        color: var(--red);
        font-size: 14px;
      }

      .danger-zone p {
        margin: 0 0 12px;
        color: var(--slate-500);
        font-size: 11px;
      }

      dialog {
        width: min(92vw, 620px);
        max-height: 88vh;
        padding: 0;
        overflow: hidden;
        border: 0;
        border-radius: 20px;
        background: white;
        box-shadow: 0 32px 80px rgba(9, 28, 51, 0.28);
      }

      dialog::backdrop {
        background: rgba(8, 27, 50, 0.5);
        backdrop-filter: blur(3px);
      }

      .dialog-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 19px 21px;
        border-bottom: 1px solid var(--slate-100);
      }

    <script>
      const STORAGE_KEY = "fangwutong.single-building.v2";
      const LEGACY_STORAGE_KEY = "fangwutong.single-building.v1";
      const CURRENT_PERIOD = toLocalDateInput(new Date()).slice(0, 7);
      const TEMPLATE_VERSION = "a4-usage-v1";
      const TEMPLATE = {

      const MENU = [
        {
          id: "rooms",
          label: "房间管理",
          icon: "房",
          items: [
            { id: "room-overview", label: "房间总览", description: "按楼层查看全部房间与当前出租状态" },
            { id: "room-occupied", label: "在租房间", description: "维护在租房间和租客档案" },
            { id: "room-vacant", label: "空置房间", description: "查看可出租房间并登记入住" },
            { id: "room-settings", label: "房间设置", description: "新增、编辑或删除房间" },
          ],
        },
        {
          id: "meters",
          label: "水电录入",
          icon: "表",
          items: [
            { id: "meter-entry", label: "本月录入", description: "录入水电读数并自动计算费用" },
            { id: "meter-import", label: "批量导入", description: "识别固定 A4 表格中的全手写月度水电用量" },
            { id: "meter-records", label: "抄表记录", description: "查询和维护历史水电记录" },
            { id: "meter-settings", label: "费用设置", description: "设置水费与电费单价" },

        {
          id: "receipts",
          label: "租金收据",

            { id: "receipt-create", label: "开具收据", description: "生成并下载标准租金收据图片" },
            { id: "receipt-records", label: "收据记录", description: "查看、重下或删除历史收据" },

        },

      const viewContainer = document.getElementById("view-container");
      const sidebar = document.getElementById("sidebar");
      const sidebarNav = document.getElementById("sidebar-nav");
      const drawerOverlay = document.getElementById("drawer-overlay");
      const menuButton = document.getElementById("menu-button");
      const roomDialog = document.getElementById("room-dialog");
      const confirmDialog = document.getElementById("confirm-dialog");
      const toast = document.getElementById("toast");

      let state = loadState();
      let activeView = "room-overview";
      let expandedGroups = new Set(MENU.map((group) => group.id));
      let roomQuery = "";
      let meterPeriodFilter = CURRENT_PERIOD;
      let receiptPeriodFilter = CURRENT_PERIOD;
      let selectedReceiptIds = new Set();
      let meterContext = { roomId: state.rooms[0]?.id || "", period: CURRENT_PERIOD };
      let receiptContext = { roomId: occupiedRooms()[0]?.id || "", period: CURRENT_PERIOD };
      let importDraft = {
        period: CURRENT_PERIOD,
        stage: "idle",
        progress: 0,
        progressText: "",
        rows: [],
        fileName: "",
        result: null,
      };
      let ocrSessionPromise = null;
      let confirmResolver = null;
      let toastTimer = 0;
      let lastFocusedElement = null;

      function createDefaultState() {
        const rooms = [];
        for (let floor = 1; floor <= 6; floor += 1) {
          for (let unit = 1; unit <= 4; unit += 1) {
            rooms.push({
              id: makeId("room"),
              number: `${floor}0${unit}`,
              floor,
              status: "vacant",
              tenantName: "",
              phone: "",
              monthlyRent: 1200,
              moveInDate: "",
              note: "",
            });
          }
        }
        return {
          version: 2,
          settings: {
            buildingName: "幸福公寓",
            waterRate: 3.5,
            electricRate: 0.8,
            receiptTitle: "房租、水、电费（专用）收据",
            payee: "房屋管理员",
          },
          rooms,
          meterRecords: [],
          receipts: [],
        };
      }

      function loadState() {
        try {
          const current = JSON.parse(localStorage.getItem(STORAGE_KEY));
          const legacy = JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY));
          const saved = current?.version === 2 ? current : legacy;
          if ([1, 2].includes(saved?.version) && Array.isArray(saved.rooms)) {
            const migrated = {
              ...createDefaultState(),
              ...saved,
              version: 2,
              settings: { ...createDefaultState().settings, ...saved.settings },
              meterRecords: Array.isArray(saved.meterRecords)
                ? saved.meterRecords.map((record) => ({
                    inputMode: record.inputMode || "meter-reading",
                    ...record,
                  }))
                : [],
              receipts: Array.isArray(saved.receipts) ? saved.receipts : [],
            };
            if (migrated.settings.receiptTitle === "租金收款收据") {
              migrated.settings.receiptTitle = "房租、水、电费（专用）收据";
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
            return migrated;
          }
        } catch (error) {
          console.warn("本地数据读取失败，已使用默认数据。", error);
        }
        const initial = createDefaultState();
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
        } catch {}
        return initial;
      }

      function saveState(message = "") {
        try {
          state.version = 2;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          if (message) showToast(message);
          renderChrome();
          return true;
        } catch {
          showToast("保存失败，请检查浏览器存储空间");
          return false;
        }
      }

      function makeId(prefix) {
        const id =
          globalThis.crypto?.randomUUID?.() ||
          `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        return `${prefix}-${id}`;
      }

      function toLocalDateInput(date) {
        const adjusted = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
        return adjusted.toISOString().slice(0, 10);
      }

      function formatMoney(value) {
        return Number(value || 0).toLocaleString("zh-CN", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }

      function formatDate(value) {
        if (!value) return "—";
        const [year, month, day] = value.split("-");
        return `${year}年${Number(month)}月${Number(day)}日`;
      }

      function formatPeriod(value) {
        if (!value) return "—";
        const [year, month] = value.split("-");
        return `${year}年${Number(month)}月`;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function occupiedRooms() {
        return state.rooms.filter((room) => room.status === "occupied");
      }

      function currentMenu() {
        for (const group of MENU) {
          const item = group.items.find((candidate) => candidate.id === activeView);
          if (item) return { group, item };
        }
        return { group: MENU[0], item: MENU[0].items[0] };
      }

      function renderChrome() {
        renderSidebar();
        renderHeader();
        renderStats();
        document.getElementById("sidebar-building").textContent = state.settings.buildingName;
        document.getElementById("mobile-building").textContent = state.settings.buildingName;
      }

      function renderSidebar() {
        const { group: activeGroup } = currentMenu();
        sidebarNav.innerHTML = MENU.map((group) => {
          const isOpen = expandedGroups.has(group.id);
          const isActive = group.id === activeGroup.id;
          return `
            <div class="nav-group">
              <button
                class="nav-parent${isActive ? " active" : ""}"
                type="button"
                data-toggle-group="${group.id}"
                aria-expanded="${isOpen}"
                aria-controls="${group.id}-children"
              >
                <span class="nav-parent-icon" aria-hidden="true">${group.icon}</span>
                <span class="nav-parent-title">${group.label}</span>
                <span class="nav-chevron" aria-hidden="true">⌄</span>
              </button>
              <div class="nav-children${isOpen ? " open" : ""}" id="${group.id}-children">
                ${group.items
                  .map(
                    (item) => `
                      <button
                        class="nav-child${item.id === activeView ? " active" : ""}"
                        type="button"
                        data-view="${item.id}"
                        aria-current="${item.id === activeView ? "page" : "false"}"
                      >${item.label}</button>
                    `,
                  )
                  .join("")}
              </div>
            </div>
          `;
        }).join("");
      }

      function renderHeader() {
        const { group, item } = currentMenu();
        document.getElementById("breadcrumb").innerHTML = `
          <span>${escapeHtml(state.settings.buildingName)}</span>
          <span class="breadcrumb-separator">/</span>
          <span>${group.label}</span>
        `;
        document.getElementById("page-title").textContent = item.label;
        document.getElementById("page-description").textContent = item.description;
        const now = new Date();
        document.getElementById("date-day").textContent = String(now.getDate()).padStart(2, "0");
        document.getElementById("date-full").textContent = now.toLocaleDateString("zh-CN", {
          year: "numeric",
          month: "long",
          weekday: "short",
        });
      }

      function renderStats() {
        const occupied = occupiedRooms().length;
        const vacant = state.rooms.length - occupied;
        const receiptedRoomIds = new Set(
          state.receipts
            .filter((receipt) => receipt.period === CURRENT_PERIOD)
            .map((receipt) => receipt.roomId),
        );
        const pending = occupiedRooms().filter((room) => !receiptedRoomIds.has(room.id)).length;
        document.getElementById("stats-grid").innerHTML = [
          ["房间总数", state.rooms.length, "间", "#e8f2fb", "#347fc0"],
          ["在租房间", occupied, "间", "#e9f7f1", "#247c5d"],
          ["空置房间", vacant, "间", "#fff3df", "#a86b1f"],
          ["本月待开收据", pending, "间", "#fff0f1", "#b54752"],
        ]
          .map(
            ([label, value, suffix, color, dot]) => `
              <article class="stat-card" style="--stat-color:${color};--stat-dot:${dot}">
                <span class="stat-label">${label}</span>
                <strong class="stat-value">${value}<span class="stat-suffix">${suffix}</span></strong>
              </article>
            `,
          )
          .join("");
      }

      function renderView() {
        const renderers = {
          "room-overview": renderRoomOverview,
          "room-occupied": () => renderRoomList("occupied"),
          "room-vacant": () => renderRoomList("vacant"),
          "room-settings": renderRoomSettings,
          "meter-entry": renderMeterEntry,
          "meter-import": renderMeterImport,
          "meter-records": renderMeterRecords,
          "meter-settings": renderMeterSettings,
          "receipt-create": renderReceiptCreate,
          "receipt-records": renderReceiptRecords,
          "receipt-settings": renderReceiptSettings,
        };
        viewContainer.innerHTML = (renderers[activeView] || renderRoomOverview)();
        syncDynamicCalculations();
      }

      function renderRoomOverview() {
        const floors = [...new Set(state.rooms.map((room) => Number(room.floor)))].sort(
          (a, b) => b - a,
        );
        if (!floors.length) return emptyState("房", "还没有房间", "请先在房间设置中新增房间。", "新增房间", "add-room");
        return `
          <section class="panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">${escapeHtml(state.settings.buildingName)}房态总览</h2>
                <p class="panel-subtitle">点击房间卡片即可编辑档案或办理入住、退租</p>
              </div>
              <button class="button button-primary" type="button" data-action="add-room">＋ 新增房间</button>
            </div>
            <div class="panel-body">
              <div class="room-floors">
                ${floors
                  .map((floor) => {
                    const rooms = state.rooms
                      .filter((room) => Number(room.floor) === floor)
                      .sort((a, b) => String(a.number).localeCompare(String(b.number), "zh-CN", { numeric: true }));
                    const occupied = rooms.filter((room) => room.status === "occupied").length;
                    return `
                      <section class="floor-section">
                        <div class="floor-heading">
                          <h3>${floor} 楼</h3>
                          <span>${occupied}/${rooms.length} 间在租</span>
                        </div>
                        <div class="room-grid">
                          ${rooms.map(roomCard).join("")}
                        </div>
                      </section>
                    `;
                  })
                  .join("")}
              </div>
            </div>
          </section>
        `;
      }

      function roomCard(room) {
        const occupied = room.status === "occupied";
        return `
          <button class="room-card" type="button" data-action="edit-room" data-room-id="${room.id}">
            <span class="room-card-top">
              <span class="room-number">${escapeHtml(room.number)}</span>
              <span class="status ${occupied ? "status-occupied" : "status-vacant"}">${occupied ? "在租" : "空置"}</span>
            </span>
            <span class="room-tenant">${occupied ? escapeHtml(room.tenantName) : "等待入住"}</span>
            <span class="room-rent">月租 ¥${formatMoney(room.monthlyRent)}</span>
          </button>
        `;
      }

      function filteredRooms(status = "") {
        const query = roomQuery.trim().toLowerCase();
        return state.rooms
          .filter((room) => !status || room.status === status)
          .filter(
            (room) =>
              !query ||
              [room.number, room.tenantName, room.phone]
                .join(" ")
                .toLowerCase()
                .includes(query),
          )
          .sort((a, b) => String(a.number).localeCompare(String(b.number), "zh-CN", { numeric: true }));
      }

      function renderRoomList(status) {
        const rooms = filteredRooms(status);
        const occupied = status === "occupied";
        return `
          <section class="panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">${occupied ? "在租房间" : "空置房间"}清单</h2>
                <p class="panel-subtitle">共 ${rooms.length} 间符合当前条件</p>
              </div>
              <button class="button button-primary" type="button" data-action="add-room" data-default-status="${status}">
                ${occupied ? "＋ 登记入住" : "＋ 新增空置房"}
              </button>
            </div>
            <div class="panel-body">
              <div class="toolbar">
                <input class="filter-input" id="room-search" type="search" placeholder="搜索房号、租客或电话" value="${escapeHtml(roomQuery)}" />
              </div>
              ${rooms.length ? roomTable(rooms, true) : emptyState("房", occupied ? "暂无在租房间" : "暂无空置房间", occupied ? "可点击“登记入住”建立租客档案。" : "当前所有房间均已出租。")}
            </div>
          </section>
        `;
      }

      function renderRoomSettings() {
        const rooms = filteredRooms();
        return `
          <section class="panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">房间档案设置</h2>
                <p class="panel-subtitle">管理楼层、房号、月租和租客资料</p>
              </div>
              <button class="button button-primary" type="button" data-action="add-room">＋ 新增房间</button>
            </div>
            <div class="panel-body">
              <div class="toolbar">
                <input class="filter-input" id="room-search" type="search" placeholder="搜索房号、租客或电话" value="${escapeHtml(roomQuery)}" />
              </div>
              ${rooms.length ? roomTable(rooms, true, true) : emptyState("房", "还没有房间", "点击上方按钮创建第一个房间。")}
              <div class="danger-zone">
                <h3>恢复默认数据</h3>
                <p>将清除当前设备上的房间、水电和收据记录，并重新生成24间默认房间。此操作不可撤销。</p>
                <button class="button button-danger" type="button" data-action="reset-data">恢复默认数据</button>
              </div>
            </div>
          </section>
        `;
      }

      function roomTable(rooms, showTenant, allowDelete = false) {
        return `
          <div class="data-table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>房间</th>
                  <th>楼层</th>
                  <th>状态</th>
                  ${showTenant ? "<th>租客</th><th>联系电话</th>" : ""}
                  <th>月租</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                ${rooms
                  .map(
                    (room) => `
                      <tr>
                        <td data-label="房间"><span class="table-primary">${escapeHtml(room.number)}</span></td>
                        <td data-label="楼层">${room.floor} 楼</td>
                        <td data-label="状态"><span class="status ${room.status === "occupied" ? "status-occupied" : "status-vacant"}">${room.status === "occupied" ? "在租" : "空置"}</span></td>
                        ${showTenant ? `<td data-label="租客">${escapeHtml(room.tenantName || "—")}</td><td data-label="联系电话">${escapeHtml(room.phone || "—")}</td>` : ""}
                        <td data-label="月租">¥${formatMoney(room.monthlyRent)}</td>
                        <td class="actions-cell" data-label="操作">
                          <div class="actions">
                            <button class="button button-soft button-small" type="button" data-action="edit-room" data-room-id="${room.id}">编辑</button>
                            ${allowDelete ? `<button class="button button-danger button-small" type="button" data-action="delete-room" data-room-id="${room.id}">删除</button>` : ""}
                          </div>
                        </td>
                      </tr>
                    `,
                  )
                  .join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function latestReading(roomId, period) {
        return state.meterRecords
          .filter(
            (record) =>
              record.roomId === roomId &&
              record.period < period &&
              record.inputMode !== "monthly-usage" &&
              Number.isFinite(Number(record.currentWater)) &&
              Number.isFinite(Number(record.currentElectric)),
          )
          .sort((a, b) => b.period.localeCompare(a.period))[0];
      }

      function currentMeterRecord() {
        return state.meterRecords.find(
          (record) =>
            record.roomId === meterContext.roomId && record.period === meterContext.period,
        );
      }

      function renderMeterEntry() {
        if (!state.rooms.length) return emptyState("表", "暂无可抄表房间", "请先在房间设置中新增房间。");
        if (!meterContext.roomId || !state.rooms.some((room) => room.id === meterContext.roomId)) {
          meterContext.roomId = state.rooms[0].id;
        }
        const existing = currentMeterRecord();
        if (existing?.inputMode === "monthly-usage") {
          return renderImportedUsageEntry(existing);
        }
        const previous = latestReading(meterContext.roomId, meterContext.period);
        const prevWater = existing?.prevWater ?? previous?.currentWater ?? 0;
        const currentWater = existing?.currentWater ?? prevWater;
        const prevElectric = existing?.prevElectric ?? previous?.currentElectric ?? 0;
        const currentElectric = existing?.currentElectric ?? prevElectric;
        return `
          <div class="split-layout">
            <section class="panel">
              <div class="panel-header">
                <div>
                  <h2 class="panel-title">${existing ? "更新本期抄表" : "录入本期抄表"}</h2>
                  <p class="panel-subtitle">同一房间同一月份仅保留一条记录</p>
                </div>
              </div>
              <div class="panel-body">
                <form id="meter-form" novalidate>
                  <div class="field-grid">
                    <label class="field">
                      <span class="field-label">账期<span class="required">*</span></span>
                      <input class="field-input" id="meter-period" name="period" type="month" value="${meterContext.period}" required />
                    </label>
                    <label class="field">
                      <span class="field-label">房间<span class="required">*</span></span>
                      <select class="field-select" id="meter-room" name="roomId" required>
                        ${state.rooms
                          .slice()
                          .sort((a, b) => String(a.number).localeCompare(String(b.number), "zh-CN", { numeric: true }))
                          .map((room) => `<option value="${room.id}" ${room.id === meterContext.roomId ? "selected" : ""}>${escapeHtml(room.number)}${room.tenantName ? ` · ${escapeHtml(room.tenantName)}` : ""}</option>`)
                          .join("")}
                      </select>
                    </label>
                    <label class="field">
                      <span class="field-label">上期水表</span>
                      <input class="field-input meter-number" id="prev-water" name="prevWater" type="number" min="0" step="0.01" value="${prevWater}" required />
                    </label>
                    <label class="field">
                      <span class="field-label">本期水表<span class="required">*</span></span>
                      <input class="field-input meter-number" id="current-water" name="currentWater" type="number" min="0" step="0.01" value="${currentWater}" required />
                    </label>
                    <label class="field">
                      <span class="field-label">上期电表</span>
                      <input class="field-input meter-number" id="prev-electric" name="prevElectric" type="number" min="0" step="0.01" value="${prevElectric}" required />
                    </label>
                    <label class="field">
                      <span class="field-label">本期电表<span class="required">*</span></span>
                      <input class="field-input meter-number" id="current-electric" name="currentElectric" type="number" min="0" step="0.01" value="${currentElectric}" required />
                    </label>
                  </div>
                  <p class="form-error" id="meter-form-error" role="alert"></p>
                  <div class="form-actions">
                    <button class="button button-primary" type="submit">${existing ? "更新记录" : "保存记录"}</button>
                  </div>
                </form>
              </div>
            </section>
            <aside class="panel">
              <div class="panel-header">
                <div>
                  <h2 class="panel-title">费用试算</h2>
                  <p class="panel-subtitle">按当前设置的单价自动计算</p>
                </div>
              </div>
              <div class="panel-body">
                <div class="calc-box" id="meter-calculation">
                  ${meterCalculationMarkup(prevWater, currentWater, prevElectric, currentElectric)}
                </div>
                <p class="field-help">水费 ¥${formatMoney(state.settings.waterRate)}/吨，电费 ¥${formatMoney(state.settings.electricRate)}/度。</p>
              </div>
            </aside>
          </div>
        `;
      }

      function renderImportedUsageEntry(record) {
        return `
          <div class="split-layout">
            <section class="panel">
              <div class="panel-header">
                <div>
                  <h2 class="panel-title">更新月度用量</h2>
                  <p class="panel-subtitle">此记录来自 A4 手写表批量导入，可在这里单独修正</p>
                </div>
                <span class="source-badge imported">批量导入</span>
              </div>
              <div class="panel-body">
                <div class="notice">
                  <strong>记录来源：</strong>
                  <span>${escapeHtml(record.importBatchId || "历史导入批次")} · ${escapeHtml(record.templateVersion || TEMPLATE_VERSION)}</span>
                </div>
                <form id="meter-usage-form" novalidate>
                  <input type="hidden" name="recordId" value="${record.id}" />
                  <div class="field-grid">
                    <label class="field">
                      <span class="field-label">账期</span>
                      <input class="field-input" value="${record.period}" disabled />
                    </label>
                    <label class="field">
                      <span class="field-label">房间</span>
                      <input class="field-input" value="${escapeHtml(roomNumber(record.roomId))}" disabled />
                    </label>
                    <label class="field">
                      <span class="field-label">用水量（吨）<span class="required">*</span></span>
                      <input class="field-input meter-number" name="waterUsage" type="number" min="0" max="99999.99" step="0.01" value="${Number(record.waterUsage).toFixed(2)}" required />
                    </label>
                    <label class="field">
                      <span class="field-label">用电量（度）<span class="required">*</span></span>
                      <input class="field-input meter-number" name="electricUsage" type="number" min="0" max="99999.99" step="0.01" value="${Number(record.electricUsage).toFixed(2)}" required />
                    </label>
                  </div>
                  <p class="form-error" id="meter-usage-form-error" role="alert"></p>
                  <div class="form-actions">
                    <button class="button button-primary" type="submit">保存修正</button>
                  </div>
                </form>
              </div>
            </section>
            <aside class="panel">
              <div class="panel-header">
                <div>
                  <h2 class="panel-title">费用快照</h2>
                  <p class="panel-subtitle">保存时按当前水电单价重新计算</p>
                </div>
              </div>
              <div class="panel-body">
                <div class="calc-box">
                  <div class="calc-row"><span>水费</span><strong>¥${formatMoney(record.waterCharge)}</strong></div>
                  <div class="calc-row"><span>电费</span><strong>¥${formatMoney(record.electricCharge)}</strong></div>
                  <div class="calc-row total"><span>水电合计</span><strong>¥${formatMoney(Number(record.waterCharge) + Number(record.electricCharge))}</strong></div>
                </div>
              </div>
            </aside>
          </div>
        `;
      }

      function meterCalculationMarkup(prevWater, currentWater, prevElectric, currentElectric) {
        const waterUsage = Math.max(0, Number(currentWater) - Number(prevWater));
        const electricUsage = Math.max(0, Number(currentElectric) - Number(prevElectric));
        const waterCharge = waterUsage * Number(state.settings.waterRate);
        const electricCharge = electricUsage * Number(state.settings.electricRate);
        return `
          <div class="calc-row"><span>水量 ${waterUsage.toFixed(2)} 吨</span><strong>¥${formatMoney(waterCharge)}</strong></div>
          <div class="calc-row"><span>电量 ${electricUsage.toFixed(2)} 度</span><strong>¥${formatMoney(electricCharge)}</strong></div>
          <div class="calc-row total"><span>水电合计</span><strong>¥${formatMoney(waterCharge + electricCharge)}</strong></div>
        `;
      }

      function renderMeterImport() {
        const analysis = analyzeImportRows();
        return `
          <section class="panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">A4 手写表批量导入</h2>
                <p class="panel-subtitle">一张表对应一个月份，房号、用水量和用电量均可手写识别</p>
              </div>

                  <span class="import-step-number">3</span>

              </div>

              ${
                importDraft.result
                  ? `
                    <div class="import-result">
                      <div>
                        <strong>${formatPeriod(importDraft.result.period)}批量导入完成</strong>
                        <p>新增 ${importDraft.result.created} 条，更新 ${importDraft.result.updated} 条，共处理 ${importDraft.result.total} 个房间。</p>
                      </div>
                      <div class="actions">
                        <button class="button button-secondary" type="button" data-action="new-meter-import">继续导入</button>
                        <button class="button button-primary" type="button" data-view="meter-records">查看抄表记录</button>
                      </div>
                    </div>
                  `
                  : `
                    <label class="upload-zone" for="meter-import-file">
                      <span>
                        <span class="upload-icon" aria-hidden="true">识</span>
                        <strong>${importDraft.fileName ? escapeHtml(importDraft.fileName) : "拍照或选择手写表照片"}</strong>
                        <small>支持 JPG、PNG、WebP；请保持纸张四角完整、画面清晰并尽量避免阴影</small>
                      </span>
                      <input class="sr-only" id="meter-import-file" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" ${importDraft.stage === "processing" ? "disabled" : ""} />
                    </label>
                    <p class="privacy-line">照片和识别过程仅在当前浏览器中处理，不会上传服务器。</p>
                  `
              }

              ${
                importDraft.stage === "processing"
                  ? `
                    <div class="recognition-progress" role="status" aria-live="polite">
                      <div class="progress-heading">
                        <strong>${escapeHtml(importDraft.progressText || "正在准备识别")}</strong>

                      <div class="progress-track"><div class="progress-bar" style="width:${Math.max(2, importDraft.progress)}%"></div></div>

                  `

              }

              ${
                importDraft.rows.length
                  ? `
                    <div style="height:18px"></div>
                    <div class="panel-header" style="padding-inline:0">
                      <div>
                        <h2 class="panel-title">识别结果核对</h2>
                        <p class="panel-subtitle">原图切片与识别值并排显示；黄色或红色行必须勾选“已人工核对”</p>

                      <div><span>有效数据</span><strong>${analysis.valid}</strong></div>
                      <div><span>需要核对</span><strong>${analysis.needsReview}</strong></div>
                      <div><span>无法导入</span><strong>${analysis.invalid}</strong></div>

                      <table class="data-table">
                        <thead><tr><th>行</th><th>房间号</th><th>用水量</th><th>用电量</th><th>费用</th><th>状态与核对</th></tr></thead>

                          ${importDraft.rows.map((row, index) => importReviewRow(row, index, analysis.rows[index])).join("")}
