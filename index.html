        ctx.strokeRect(88, 78, 1424, 924);

        ctx.fillStyle = "#173b67";
        ctx.textAlign = "center";
        ctx.font = `700 34px ${font}`;
        ctx.fillText(receipt.buildingName, 800, 140);
        ctx.font = `800 56px ${font}`;
        ctx.fillText(receipt.receiptTitle, 800, 215);
        ctx.fillStyle = "#667085";
        ctx.font = `24px ${font}`;
        ctx.fillText(`收据编号：${receipt.serial}`, 800, 260);

        const left = 150;
        const right = 1450;
        const lineY = [330, 410, 500, 590, 680, 770, 860];
        ctx.strokeStyle = "#d8e0e9";
        ctx.lineWidth = 2;
        lineY.forEach((y) => {
          ctx.beginPath();
          ctx.moveTo(left, y);
          ctx.lineTo(right, y);
          ctx.stroke();
        });

        ctx.textAlign = "left";
        ctx.fillStyle = "#344054";
        ctx.font = `30px ${font}`;
        ctx.fillText(`付款人：${receipt.tenantName}`, left, 312);
        ctx.fillText(`房间：${receipt.roomNumber}`, 650, 312);
        ctx.fillText(`账期：${formatPeriod(receipt.period)}`, 1050, 312);

        const rows = [
          ["房屋租金", receipt.rent],
          ["水费", receipt.waterCharge],
          ["电费", receipt.electricCharge],
          ["其他费用", receipt.otherAmount],
        ];
        ctx.font = `28px ${font}`;
        rows.forEach(([label, amount], index) => {
          const y = 385 + index * 90;
          ctx.fillStyle = "#475467";
          ctx.fillText(label, left + 40, y);
          ctx.textAlign = "right";
          ctx.fillStyle = "#182235";
          ctx.fillText(`¥ ${formatMoney(amount)}`, right - 40, y);
          ctx.textAlign = "left";
        });

        ctx.fillStyle = "#173b67";
        ctx.font = `800 38px ${font}`;
        ctx.fillText("合计", left + 40, 745);
        ctx.textAlign = "right";
        ctx.font = `800 44px ${font}`;
        ctx.fillText(`¥ ${formatMoney(receipt.total)}`, right - 40, 745);

        ctx.textAlign = "left";
        ctx.fillStyle = "#667085";
        ctx.font = `24px ${font}`;
        ctx.fillText(`支付方式：${receipt.paymentMethod}`, left + 40, 835);
        ctx.fillText(`收款日期：${formatDate(receipt.receivedAt)}`, 650, 835);
        ctx.fillText(`收款人：${receipt.payee}`, 1120, 835);
        ctx.font = `22px ${font}`;
        ctx.fillText(`备注：${receipt.note || "无"}`.slice(0, 62), left + 40, 925);

        ctx.textAlign = "center";
        ctx.fillStyle = "#98a2b3";
        ctx.font = `19px ${font}`;
        ctx.fillText("本收据由房务通生成，请妥善保存", 800, 975);

        canvas.toBlob((blob) => {
          if (!blob) {
            showToast("收据图片生成失败");
            return;
          }
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = `${receipt.serial}-${receipt.roomNumber}.png`.replace(/[\\/:*?"<>|]/g, "-");
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        }, "image/png");
      }

      sidebarNav.addEventListener("click", (event) => {
        const parent = event.target.closest("[data-toggle-group]");
        if (parent) {
          const groupId = parent.dataset.toggleGroup;
          expandedGroups.has(groupId)
            ? expandedGroups.delete(groupId)
            : expandedGroups.add(groupId);
          renderSidebar();
          return;
        }
        const child = event.target.closest("[data-view]");
        if (child) navigate(child.dataset.view);
      });

      menuButton.addEventListener("click", () =>
        sidebar.classList.contains("open") ? closeDrawer() : openDrawer(),
      );
      drawerOverlay.addEventListener("click", () => closeDrawer());

      document.addEventListener("click", async (event) => {
        const closeButton = event.target.closest("[data-close-dialog]");
        if (closeButton) {
          closeDialog(document.getElementById(closeButton.dataset.closeDialog));
          return;
        }
        const confirmButton = event.target.closest("[data-confirm-result]");
        if (confirmButton) {
          resolveConfirm(confirmButton.dataset.confirmResult === "true");
          return;
        }
        const navButton = event.target.closest("[data-view]");
        if (navButton && !navButton.closest("#sidebar-nav")) {
          navigate(navButton.dataset.view);
          return;
        }
        const actionButton = event.target.closest("[data-action]");
        if (!actionButton) return;
        const action = actionButton.dataset.action;

        if (action === "add-room") {
          openRoomDialog("", actionButton.dataset.defaultStatus || "vacant");
        } else if (action === "edit-room") {
          openRoomDialog(actionButton.dataset.roomId);
        } else if (action === "delete-room") {
          const roomId = actionButton.dataset.roomId;
          const room = state.rooms.find((candidate) => candidate.id === roomId);
          const hasRelated =
            state.meterRecords.some((record) => record.roomId === roomId) ||
            state.receipts.some((receipt) => receipt.roomId === roomId);
          if (hasRelated) {
            showToast("该房间存在水电或收据记录，请先处理关联记录");
            return;
          }
          if (await askConfirm(`确定删除房间 ${room.number} 吗？此操作不可撤销。`)) {
            state.rooms = state.rooms.filter((candidate) => candidate.id !== roomId);
            saveState("房间已删除");
            renderView();
          }
        } else if (action === "edit-meter") {
          const record = state.meterRecords.find(
            (candidate) => candidate.id === actionButton.dataset.recordId,
          );
          meterContext = { roomId: record.roomId, period: record.period };
          navigate("meter-entry");
        } else if (action === "delete-meter") {
          const recordId = actionButton.dataset.recordId;
          const record = state.meterRecords.find((candidate) => candidate.id === recordId);
          if (await askConfirm(`确定删除 ${roomNumber(record.roomId)} 的 ${formatPeriod(record.period)} 抄表记录吗？`)) {
            state.meterRecords = state.meterRecords.filter((candidate) => candidate.id !== recordId);
            saveState("抄表记录已删除");
            renderView();
          }
        } else if (action === "download-receipt") {
          const receipt = state.receipts.find(
            (candidate) => candidate.id === actionButton.dataset.receiptId,
          );
          if (receipt) downloadReceiptImage(receipt);
        } else if (action === "delete-receipt") {
          const receiptId = actionButton.dataset.receiptId;
          const receipt = state.receipts.find((candidate) => candidate.id === receiptId);
          if (await askConfirm(`确定删除收据 ${receipt.serial} 吗？`)) {
            state.receipts = state.receipts.filter((candidate) => candidate.id !== receiptId);
            saveState("收据记录已删除");
            renderView();
          }
        } else if (action === "clear-meter-filter") {
          meterPeriodFilter = "";
          renderView();
        } else if (action === "clear-receipt-filter") {
          receiptPeriodFilter = "";
          renderView();
        } else if (action === "reset-data") {
          if (await askConfirm("恢复默认数据将清除当前设备上的全部房间、水电和收据记录。确定继续吗？", "清除并恢复")) {
            state = createDefaultState();
            meterContext = { roomId: state.rooms[0].id, period: CURRENT_PERIOD };
            receiptContext = { roomId: "", period: CURRENT_PERIOD };
            saveState("已恢复24间默认房间");
            renderView();
          }
        } else if (action === "go-meter-entry") {
          navigate("meter-entry");
        } else if (action === "go-receipt-create") {
          navigate("receipt-create");
        } else if (action === "go-occupied") {
          navigate("room-occupied");
        }
      });

      document.addEventListener("input", (event) => {
        if (event.target.matches(".meter-number, .receipt-amount")) {
          syncDynamicCalculations();
        }
        if (event.target.id === "room-search") {
          roomQuery = event.target.value;
          const position = event.target.selectionStart;
          renderView();
          const input = document.getElementById("room-search");
          input?.focus();
          input?.setSelectionRange(position, position);
        }
      });

      document.addEventListener("change", (event) => {
        if (event.target.id === "room-status") syncTenantFields();
        if (event.target.id === "meter-room" || event.target.id === "meter-period") {
          meterContext = {
            roomId: document.getElementById("meter-room").value,
            period: document.getElementById("meter-period").value || CURRENT_PERIOD,
          };
          renderView();
        }
        if (event.target.id === "receipt-room" || event.target.id === "receipt-period") {
          receiptContext = {
            roomId: document.getElementById("receipt-room").value,
            period: document.getElementById("receipt-period").value || CURRENT_PERIOD,
          };
          renderView();
        }
        if (event.target.id === "meter-filter-period") {
          meterPeriodFilter = event.target.value;
          renderView();
        }
        if (event.target.id === "receipt-filter-period") {
          receiptPeriodFilter = event.target.value;
          renderView();
        }
      });

      document.addEventListener("submit", (event) => {
        event.preventDefault();
        const form = event.target;

        if (form.id === "room-form") {
          const data = new FormData(form);
          const roomId = data.get("roomId");
          const number = String(data.get("number") || "").trim();
          const floor = Number(data.get("floor"));
          const status = data.get("status");
          const tenantName = String(data.get("tenantName") || "").trim();
          const monthlyRent = Number(data.get("monthlyRent"));
          const error = document.getElementById("room-form-error");
          if (!number || !Number.isInteger(floor) || floor < 1 || monthlyRent < 0) {
            error.textContent = "请填写有效的房号、楼层和月租。";
            return;
          }
          if (state.rooms.some((room) => room.number === number && room.id !== roomId)) {
            error.textContent = "房间号已存在，请更换后再保存。";
            return;
          }
          if (status === "occupied" && !tenantName) {
            error.textContent = "在租房间必须填写租客姓名。";
            return;
          }
          const room = {
            id: roomId || makeId("room"),
            number,
            floor,
            status,
            tenantName: status === "occupied" ? tenantName : "",
            phone: status === "occupied" ? String(data.get("phone") || "").trim() : "",
            monthlyRent,
            moveInDate: status === "occupied" ? String(data.get("moveInDate") || "") : "",
            note: String(data.get("note") || "").trim(),
          };
          if (roomId) {
            state.rooms = state.rooms.map((candidate) =>
              candidate.id === roomId ? room : candidate,
            );
          } else {
            state.rooms.push(room);
          }
          closeDialog(roomDialog);
          saveState(roomId ? "房间档案已更新" : "房间已新增");
          renderView();
        }

        if (form.id === "meter-form") {
          const data = new FormData(form);
          const roomId = String(data.get("roomId"));
          const period = String(data.get("period"));
          const prevWater = Number(data.get("prevWater"));
          const currentWater = Number(data.get("currentWater"));
          const prevElectric = Number(data.get("prevElectric"));
          const currentElectric = Number(data.get("currentElectric"));
          const error = document.getElementById("meter-form-error");
          if (
            !roomId ||
            !period ||
            [prevWater, currentWater, prevElectric, currentElectric].some(
              (value) => !Number.isFinite(value) || value < 0,
            )
          ) {
            error.textContent = "请填写完整且不小于0的水电读数。";
            return;
          }
          if (currentWater < prevWater || currentElectric < prevElectric) {
            error.textContent = "本期读数不能低于上期读数。";
            return;
          }
          const existing = state.meterRecords.find(
            (record) => record.roomId === roomId && record.period === period,
          );
          const waterUsage = currentWater - prevWater;
          const electricUsage = currentElectric - prevElectric;
          const record = {
            id: existing?.id || makeId("meter"),
            roomId,
            period,
            prevWater,
            currentWater,
            prevElectric,
            currentElectric,
            waterRate: Number(state.settings.waterRate),
            electricRate: Number(state.settings.electricRate),
            waterUsage,
            electricUsage,
            waterCharge: Number((waterUsage * Number(state.settings.waterRate)).toFixed(2)),
            electricCharge: Number((electricUsage * Number(state.settings.electricRate)).toFixed(2)),
            updatedAt: new Date().toISOString(),
          };
          state.meterRecords = existing
            ? state.meterRecords.map((candidate) =>
                candidate.id === existing.id ? record : candidate,
              )
            : [...state.meterRecords, record];
          saveState(existing ? "本期抄表记录已更新" : "本期抄表记录已保存");
          renderView();
        }

        if (form.id === "meter-settings-form") {
          const data = new FormData(form);
          const waterRate = Number(data.get("waterRate"));
          const electricRate = Number(data.get("electricRate"));
          if (waterRate < 0 || electricRate < 0) {
            showToast("水电单价不能小于0");
            return;
          }
          state.settings.waterRate = waterRate;
          state.settings.electricRate = electricRate;
          saveState("水电单价已保存");
          renderView();
        }

        if (form.id === "receipt-form") {
          const data = new FormData(form);
          const roomId = String(data.get("roomId"));
          const period = String(data.get("period"));
          const error = document.getElementById("receipt-form-error");
          if (state.receipts.some((receipt) => receipt.roomId === roomId && receipt.period === period)) {
            error.textContent = "该房间本账期已开具收据，请从收据记录中重新下载。";
            return;
          }
          const amounts = {
            rent: Number(data.get("rent")),
            waterCharge: Number(data.get("waterCharge")),
            electricCharge: Number(data.get("electricCharge")),
            otherAmount: Number(data.get("otherAmount")),
          };
          if (
            !roomId ||
            !period ||
            !String(data.get("tenantName") || "").trim() ||
            Object.values(amounts).some((value) => !Number.isFinite(value) || value < 0)
          ) {
            error.textContent = "请完整填写房间、租客、账期和有效费用金额。";
            return;
          }
          const room = state.rooms.find((candidate) => candidate.id === roomId);
          const receipt = {
            id: makeId("receipt"),
            serial: nextReceiptSerial(period),
            roomId,
            roomNumber: room.number,
            tenantName: String(data.get("tenantName")).trim(),
            period,
            ...amounts,
            total: Number(Object.values(amounts).reduce((sum, value) => sum + value, 0).toFixed(2)),
            paymentMethod: String(data.get("paymentMethod")),
            receivedAt: String(data.get("receivedAt")),
            payee: String(data.get("payee")).trim(),
            note: String(data.get("note") || "").trim(),
            buildingName: state.settings.buildingName,
            receiptTitle: state.settings.receiptTitle,
            createdAt: new Date().toISOString(),
          };
          state.receipts.push(receipt);
          if (saveState("收据已保存，正在生成图片")) {
            downloadReceiptImage(receipt);
            navigate("receipt-records");
          }
        }

        if (form.id === "receipt-settings-form") {
          const data = new FormData(form);
          state.settings.buildingName = String(data.get("buildingName")).trim();
          state.settings.receiptTitle = String(data.get("receiptTitle")).trim();
          state.settings.payee = String(data.get("payee")).trim();
          saveState("收据模板已保存");
          renderView();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeDrawer();
        if (event.key === "Tab" && sidebar.classList.contains("open")) {
          const focusable = [...sidebar.querySelectorAll("button:not([disabled])")];
          if (!focusable.length) return;
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        }
      });

      window.addEventListener("resize", () => {
        if (window.innerWidth > 920) closeDrawer(false);
      });

      roomDialog.addEventListener("close", () => {
        document.getElementById("room-form-error").textContent = "";
      });
      confirmDialog.addEventListener("cancel", (event) => {
        event.preventDefault();
        resolveConfirm(false);
      });

      renderChrome();
      renderView();
    </script>
  </body>
</html>
